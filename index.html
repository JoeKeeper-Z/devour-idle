<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>吞噬进化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0e14;color:#c8d3e0;min-height:100vh;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 50% 0%,#141d2b 0%,#0a0e14 60%);
}
#app{max-width:480px;margin:0 auto;padding:10px 12px 112px}

.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:rgba(20,29,43,.7);border:1px solid #1e2b3d;
  border-radius:10px;margin-bottom:10px;font-size:13px}
.topbar .ess{color:#7dd3a0;font-weight:600}
.topbar .floor{color:#7aa2f7}
.topbar .realm{color:#c4a5ff;font-weight:700}

.monster{background:linear-gradient(180deg,#141d2b 0%,#0f1620 100%);
  border:1px solid #1e2b3d;border-radius:14px;padding:14px;margin-bottom:10px;
  position:relative;overflow:hidden}
.monster::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(122,162,247,.08),transparent 70%);
  pointer-events:none}
.mon-name{font-size:17px;font-weight:700;color:#e6edf7;margin-bottom:2px;text-align:center}
.mon-stage{font-size:11px;color:#5a6b80;text-align:center;margin-bottom:10px}
.mon-emoji{font-size:52px;text-align:center;line-height:1.15;margin-bottom:8px;
  filter:drop-shadow(0 0 14px rgba(122,162,247,.35))}
.bar{background:#0a0e14;border-radius:6px;height:16px;overflow:hidden;
  border:1px solid #1e2b3d;position:relative;margin-bottom:6px}
.bar-fill{height:100%;transition:width .18s linear;border-radius:5px}
.bar-fill.hp-mon{background:linear-gradient(90deg,#e05252,#f28b8b)}
.bar-fill.hp-me{background:linear-gradient(90deg,#3f8f5f,#7dd3a0)}
.bar-fill.exp{background:linear-gradient(90deg,#6b4fbf,#a78bfa)}
.bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#e6edf7;text-shadow:0 1px 2px #000}
.bar.shield{height:6px;margin-top:-3px;margin-bottom:8px;border-color:#2b3f5c}
.bar.shield .bar-fill{background:linear-gradient(90deg,#4a7fd4,#8fb8f0)}

.auto-tag{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;color:#7dd3a0;padding:8px;margin-bottom:10px;
  background:rgba(63,143,95,.1);border:1px solid rgba(63,143,95,.3);border-radius:9px}
.dot{width:6px;height:6px;border-radius:50%;background:#7dd3a0;
  animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.panel{background:rgba(20,29,43,.55);border:1px solid #1e2b3d;border-radius:12px;
  padding:12px;margin-bottom:10px}
.panel h3{font-size:12px;color:#5a6b80;font-weight:600;letter-spacing:1px;margin-bottom:10px;
  display:flex;justify-content:space-between}
.panel h3 .hint{color:#3d4d61;font-weight:500;letter-spacing:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
  font-size:13px;border-bottom:1px solid rgba(30,43,61,.6)}
.row:last-child{border-bottom:none}
.row .k{color:#8a9bb0}
.row .v{color:#e6edf7;font-weight:600;font-variant-numeric:tabular-nums}

.upg{display:flex;flex-wrap:wrap;gap:8px}
.upg button{flex:1 1 calc(50% - 4px);padding:12px 8px;border-radius:10px;cursor:pointer;
  background:#16202e;border:1px solid #22303f;color:#c8d3e0;
  font-size:13px;font-weight:600;transition:.12s;font-family:inherit}
.upg button:active{transform:scale(.96)}
.upg button.can{border-color:#3f8f5f;background:rgba(63,143,95,.15);color:#a7e3bd}
.upg button:disabled{opacity:.4}
.upg .cost{display:block;font-size:11px;color:#7dd3a0;margin-top:3px;font-weight:500}

.slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  background:#101a26;border:1px solid #1e2b3d;margin-bottom:8px;cursor:pointer}
.slot:active{background:#16222f}
.slot.empty{border-style:dashed;opacity:.8}
.slot .sicon{font-size:20px;width:26px;text-align:center}
.slot .sinfo{flex:1;min-width:0}
.slot .sname{font-size:13px;font-weight:700;color:#c4a5ff;margin-bottom:2px}
.slot .scond{font-size:11px;color:#8a9bb0}
.slot .sarrow{color:#3d4d61;font-size:14px}
.slot.locked{opacity:.4;cursor:default}
.slot .sname.none{color:#5a6b80}

.log{max-height:132px;overflow-y:auto;font-size:11.5px;line-height:1.75;color:#8a9bb0;
  font-family:ui-monospace,Consolas,monospace}
.log div{padding:1px 0}
.log .c-good{color:#7dd3a0}
.log .c-bad{color:#e08080}
.log .c-epic{color:#c4a5ff;font-weight:600}
.log .c-skill{color:#8fb8f0}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:#22303f;border-radius:2px}

.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,20,.96);
  border-top:1px solid #1e2b3d;padding:8px 12px;display:flex;gap:8px;
  backdrop-filter:blur(12px);z-index:10}
.bottom button{flex:1;padding:11px;border-radius:9px;border:1px solid #22303f;
  background:#16202e;color:#8a9bb0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bottom button.on{border-color:#3f8f5f;color:#a7e3bd;background:rgba(63,143,95,.15)}
.bottom button:active{transform:scale(.96)}

@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}}
.dmg{position:absolute;left:50%;top:56%;font-size:17px;font-weight:800;
  pointer-events:none;animation:floatUp .75s ease-out forwards;z-index:5;
  text-shadow:0 2px 6px #000}
.dmg.crit{font-size:26px;color:#ffd166}
.dmg.normal{color:#ff9d9d}
.dmg.skill{color:#9de3ff;font-size:22px}

@keyframes devourFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 65%);
  pointer-events:none;animation:devourFlash .9s ease-out;z-index:20}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);
  background:rgba(167,139,250,.95);color:#0a0e14;padding:10px 18px;border-radius:9px;
  font-size:13px;font-weight:700;z-index:30;pointer-events:none;
  box-shadow:0 6px 24px rgba(167,139,250,.4);animation:devourFlash 1.8s ease-out forwards}

.overlay{position:fixed;inset:0;background:rgba(4,7,11,.82);z-index:50;
  display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.sheet{width:100%;max-height:82vh;overflow-y:auto;background:#0f1620;
  border-top:1px solid #22303f;border-radius:16px 16px 0 0;padding:16px 14px 24px;
  animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h4{font-size:13px;color:#7aa2f7;margin-bottom:10px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px;border-radius:9px;
  background:#131d29;border:1px solid #1e2b3d;margin-bottom:7px;cursor:pointer;font-size:12.5px}
.opt:active{background:#1a2836}
.opt.sel{border-color:#7a5cd6;background:rgba(122,92,214,.16)}
.opt.lock{opacity:.35;cursor:default}
.opt .oi{font-size:17px;width:22px;text-align:center}
.opt .ot{flex:1}
.opt .od{font-size:10.5px;color:#7e8fa3;margin-top:2px}
.sheet .close{width:100%;padding:12px;border-radius:9px;border:1px solid #22303f;
  background:#16202e;color:#8a9bb0;font-size:13px;font-weight:600;margin-top:12px;
  cursor:pointer;font-family:inherit}

/* 离线结算 */
.offline{position:fixed;inset:0;background:rgba(4,7,11,.9);z-index:60;
  display:none;align-items:center;justify-content:center;padding:24px}
.offline.on{display:flex}
.offcard{width:100%;max-width:340px;background:#0f1620;border:1px solid #22303f;
  border-radius:16px;padding:22px 18px;text-align:center}
.offcard h2{font-size:16px;color:#c4a5ff;margin-bottom:6px}
.offcard .sub{font-size:11.5px;color:#5a6b80;margin-bottom:16px}
.offcard .big{font-size:26px;font-weight:800;color:#7dd3a0;margin:6px 0}
.offcard .line{font-size:12.5px;color:#8a9bb0;margin:4px 0;display:flex;
  justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(30,43,61,.6)}
.offcard button{width:100%;margin-top:16px;padding:12px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#7a5cd6,#3d6fd6);color:#fff;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div><span class="realm" id="realmName">觉醒者</span> Lv.<span id="lvNum">1</span></div>
    <div>精华 <span class="ess" id="ess">0</span></div>
    <div>第<span class="floor" id="floorIdx">1</span>层</div>
  </div>

  <div class="monster" id="monsterCard">
    <div class="mon-emoji" id="monEmoji">🐀</div>
    <div class="mon-name" id="monName">铁皮鼠</div>
    <div class="mon-stage" id="monStage">已吞噬 0 / 10</div>
    <div id="affixRow" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px"></div>
    <div class="bar"><div class="bar-fill hp-mon" id="monHpBar" style="width:100%"></div>
      <div class="bar-txt" id="monHpTxt">20 / 20</div></div>
    <div class="bar" style="height:12px;margin-top:3px"><div class="bar-fill hp-me" id="meHpBar" style="width:100%"></div>
      <div class="bar-txt" style="font-size:9px;opacity:.8" id="meHpTxt">你 50 / 50</div></div>
    <div class="bar shield" id="shieldBar" style="display:none">
      <div class="bar-fill" id="shieldFill" style="width:0%"></div></div>
  </div>

  <div class="auto-tag"><span class="dot"></span><span id="autoTxt">自动战斗中</span></div>

  <div class="panel">
    <h3>修行 <span class="hint" id="realmHint">觉醒者 · 距突破 10 级</span></h3>
    <div class="bar" style="height:14px"><div class="bar-fill exp" id="expBar" style="width:0%"></div>
      <div class="bar-txt" id="expTxt">0 / 20 经验</div></div>
    <div class="row"><span class="k">境界加成</span><span class="v" id="realmMul">×1.00</span></div>
    <div class="row"><span class="k">攻击倍率</span><span class="v" id="atkMul">×1.00</span></div>
    <div class="row"><span class="k">精华倍率</span><span class="v" id="essMul">×1.00</span></div>
    <div class="row"><span class="k">裂隙共鸣</span><span class="v" id="riftMul">×1.00</span></div>
    <div class="row"><span class="k">本层收益</span><span class="v" id="farmMul">×1.00</span></div>
  </div>

  <div class="panel">
    <h3>战术 <span class="hint" id="slotHint">1 / 3 槽位</span></h3>
    <div id="slotList"></div>
  </div>

  <div class="panel">
    <h3>属性</h3>
    <div class="row"><span class="k">攻击力</span><span class="v" id="sAtk">5</span></div>
    <div class="row"><span class="k">生命</span><span class="v" id="sHp">50 / 50</span></div>
    <div class="row"><span class="k">暴击率</span><span class="v" id="sCrit">5%</span></div>
    <div class="row"><span class="k">每秒精华</span><span class="v" id="sEps">0.0</span></div>
    <div class="row"><span class="k">上一战</span><span class="v" id="sLast">—</span></div>
  </div>

  <div class="panel">
    <h3>强化</h3>
    <div class="upg">
      <button id="uAtk">攻击 +2<span class="cost" id="cAtk">10 精华</span></button>
      <button id="uHp">生命 +10<span class="cost" id="cHp">10 精华</span></button>
      <button id="uCrit">暴击 +1%<span class="cost" id="cCrit">25 精华</span></button>
      <button id="uSpeed">攻速 +8%<span class="cost" id="cSpeed">40 精华</span></button>
    </div>
  </div>

  <div class="panel">
    <h3>战斗记录</h3>
    <div class="log" id="log"></div>
  </div>

</div>

<div class="bottom">
  <button id="btnNext">下一只</button>
  <button id="btnAuto" class="on">自动推进：开</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="offline" id="offlineBox">
  <div class="offcard">
    <h2>欢迎回来</h2>
    <div class="sub" id="offSub">离线期间，裂隙里没停过。</div>
    <div class="big" id="offEss">+0 精华</div>
    <div class="line"><span>离线时长</span><span id="offTime">—</span></div>
    <div class="line"><span>经验</span><span id="offExp">+0</span></div>
    <div class="line"><span>效率</span><span>50%</span></div>
    <button onclick="closeOffline()">收下</button>
  </div>
</div>

<script>
// ============================================================
// 怪物模板（9 种，全部技能来源）
// ============================================================
const TEMPLATES = [
  {name:'铁皮鼠',   emoji:'🐀', hp:20,  atk:2,  ess:3,  skill:'harden'},
  {name:'腐骨犬',   emoji:'🐕', hp:34,  atk:3,  ess:4,  skill:'bloodthirst'},
  {name:'灰翼蝠',   emoji:'🦇', hp:44,  atk:4,  ess:5,  skill:'haste'},
  {name:'幽影狼',   emoji:'🐺', hp:78,  atk:7,  ess:8,  skill:'rend'},
  {name:'熔岩蛛',   emoji:'🕷', hp:110, atk:9,  ess:10, skill:'venom'},
  {name:'石甲蜥',   emoji:'🦎', hp:165, atk:11, ess:13, skill:'ironwall'},
  {name:'电光隼',   emoji:'🦅', hp:240, atk:16, ess:18, skill:'triple'},
  {name:'骨刺巨像', emoji:'💀', hp:340, atk:21, ess:22, skill:'crush'},
  {name:'虚空之眼', emoji:'👁', hp:470, atk:26, ess:28, skill:'soul'},
];

// 前 3 层：原始 3 只一组；第 4 层起按模板自动生成
const FLOOR_NAMES = ['微光裂隙','锈蚀裂隙','深核裂隙'];

function floorDef(f){            // f 从 0 开始
  const lvl = f + 1;
  if(f < 3){
    return {tier:['F','E','D'][f], name:FLOOR_NAMES[f], affixes:[],
      monsters: TEMPLATES.slice(f*3, f*3+3).map(function(t){ return {tpl:t, mult:1, affixes:[]}; })};
  }
  const depth = f - 2;                       // 第 4 层 = 1
  const hpMul  = Math.pow(CFG.hpGrow, depth);
  const atkMul = Math.pow(CFG.monAtkGrow, depth);
  const essMul = Math.pow(CFG.essGrow, depth);
  const grade = ['F','E','D','C','B','A','S','SS','SSS'][Math.min(8, Math.floor(depth/8))];
  // 词缀：第 4 层起每层 1 个，第 10 层起 2 个（轮换，保证每层有辨识度）
  const aff = pickAffixes(f);
  const mons = [];
  for(let i=0;i<3;i++){
    const tpl = TEMPLATES[(f*3 + i) % 9];
    mons.push({tpl:tpl, mult:hpMul, atkMult:atkMul, essMult:essMul, affixes:aff});
  }
  return {tier:grade, name:'裂隙 · 第'+lvl+'层', monsters:mons, affixes:aff};
}

// ============================================================
// 技能表
// ============================================================
const SKILLS = {
  harden:      {name:'硬化', icon:'🛡', cd:7000,  desc:'获得最大生命 20% 的护盾'},
  bloodthirst: {name:'嗜血', icon:'🩸', cd:6000,  desc:'立即回复 10% 生命'},
  haste:       {name:'疾风', icon:'⚡', cd:13000, desc:'5 秒内攻速 ×2'},
  rend:        {name:'裂爪', icon:'🗡', cd:6000,  desc:'一次 220% 攻击力的重击'},
  venom:       {name:'淬毒', icon:'☠', cd:8000,  desc:'中毒 6 秒，每秒 30% 攻击力'},
  ironwall:    {name:'铁壁', icon:'🪨', cd:14000, desc:'5 秒内受到伤害 -50%'},
  triple:      {name:'连斩', icon:'✨', cd:7000,  desc:'连续 3 次 60% 攻击力攻击'},
  crush:       {name:'碎骨', icon:'💥', cd:10000, desc:'300% 攻击力，自损 5% 生命'},
  soul:        {name:'噬魂', icon:'🌀', cd:16000, desc:'立即获得 3 倍怪物精华'},
};

const CONDS = {
  always:   {label:'无条件（冷却好就放）', test:function(c){ return true; }},
  enemyLow: {label:'敌人生命 < 35%',       test:function(c){ return c.monPct < 0.35; }},
  selfLow:  {label:'自身生命 < 55%',       test:function(c){ return c.mePct < 0.55; }},
  opening:  {label:'敌人生命 > 70%（开局）', test:function(c){ return c.monPct > 0.70; }},
  every3:   {label:'每 3 次普攻后',        test:function(c){ return c.atkCount > 0 && c.atkCount % 3 === 0; }},
};

// ============================================================
// 境界（沿用世界观阶位表）
// ============================================================
const REALMS = [
  {name:'觉醒者', from:1,  to:10,  mul:1.00, bonus:'—'},
  {name:'精锐级', from:11, to:30,  mul:1.45, bonus:'全属性 +45%'},
  {name:'战将级', from:31, to:50,  mul:2.10, bonus:'全属性 +110%'},
  {name:'王级',   from:51, to:70,  mul:3.10, bonus:'全属性 +210%'},
  {name:'帝级',   from:71, to:90,  mul:4.60, bonus:'全属性 +360%'},
  {name:'神级',   from:91, to:100, mul:7.00, bonus:'全属性 +600%'},
];
const LV_MAX = 100;

function realmOf(lv){
  for(let i=REALMS.length-1;i>=0;i--) if(lv >= REALMS[i].from) return i;
  return 0;
}
// 升级所需经验
function expNeed(lv){ return Math.round(20 * Math.pow(CFG.expGrow, lv-1)); }

// ============================================================
// 数值配置（调平衡只改这里）
// ============================================================
const CFG = {
  hpGrow:     1.18,   // 每深入 1 层，怪血量倍率（模拟调优值）
  monAtkGrow: 1.09,   // 每深入 1 层，怪攻击倍率（必须远低于 hpGrow，否则变死亡循环）
  essGrow:    1.11,   // 每深入 1 层，精华倍率（必须低于 hpGrow，否则滚雪球）
  upCostGrow: 1.22,   // 升级花费倍率
  upPowGrow:  1.03,   // 升级效果倍率（几何成长，防数值墙）
  expGrow:    1.28,   // 每级所需经验成长
  expRatio:   0.5,    // 经验 = 精华 × 系数
  riftGrow:   1.08,   // 裂隙共鸣：每深入一层，永久全属性倍率（必须低于 hpGrow）
  farmDecay:  0.08,   // 低于最深纪录每层，收益衰减 8%
  farmMin:    0.20,   // 收益衰减下限
  spdMax:     24,     // 攻速升级上限（0.92^24 ≈ 0.135）
  critMax:    75,     // 暴击率上限
  minInterval:160,    // 攻击间隔下限（毫秒），防止无限连击
  advSecLimit:45,     // 单场超过这么多秒就原地刷，不再自动深入
  floorCap:   999,
};

// ============================================================
// 敌人词缀：只改行为，不改数值
// ============================================================
const AFFIXES = {
  thorns:  {name:'反伤', icon:'🛡', desc:'被打中时反弹伤害（上限为你最大生命的 5%）'},
  regen:   {name:'再生', icon:'♻️', desc:'每 4 秒回复自身 6% 生命'},
  enrage:  {name:'狂暴', icon:'⚡', desc:'自身生命低于 35% 时攻击力 ×2'},
  immune:  {name:'免疫', icon:'🧊', desc:'开战后 3 秒内免疫伤害'},
  leech:   {name:'吸血', icon:'🩸', desc:'每次攻击回复自身 4% 生命'},
  burn:    {name:'灼烧', icon:'🔥', desc:'攻击附加 3 秒灼烧'},
};
const AFFIX_ORDER = ['thorns','regen','enrage','immune','leech','burn'];

// 按层抽词缀：同层固定（可记忆、可规划），跨层不同（不可预测）
function seededRand(seed){
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function pickAffixes(f){
  if(f < 3) return [];
  const n = f < 12 ? 1 : 2;   // 12 层前只挂 1 个，避免早期双词缀劝退
  const pool = AFFIX_ORDER.slice();
  const out = [];
  for(let i=0;i<n;i++){
    const idx = Math.floor(seededRand(f*13 + i*7 + 3) * pool.length) % pool.length;
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}

// ============================================================
// 裂隙事件（每 5 层一次，三选一，风险换收益）
// ============================================================
const EVENTS = [
  {id:'tide',      name:'狂潮', icon:'🌊', desc:'本层怪物生命 ×1.6，精华 ×2.2',   mod:{hp:1.6, ess:2.2}},
  {id:'thin',      name:'瘠薄', icon:'🍂', desc:'本层怪物生命 ×0.7，精华 ×0.6',   mod:{hp:0.7, ess:0.6}},
  {id:'sacrifice', name:'献祭', icon:'🩸', desc:'立刻失去 30% 生命，本层精华 ×3', mod:{ess:3.0}, cost:'hp30'},
  {id:'echo',      name:'残响', icon:'🌀', desc:'尝试吞噬一个未习得技能（30% 失败）', mod:{}, special:'echo'},
  {id:'purge',     name:'净化', icon:'✨', desc:'本层去掉全部词缀，精华 ×0.5',    mod:{ess:0.5, noAffix:true}},
  {id:'raid',      name:'掠夺', icon:'⚔️', desc:'本层怪物攻击 ×1.5，精华 ×1.8',   mod:{atk:1.5, ess:1.8}},
];

const KILLS_PER_TRAIT = 10;
const SLOT_UNLOCK = [4, 7];
const SAVE_KEY = 'devour_idle_v3';
const OFF_CAP_SEC = 8*3600;
const OFF_RATE = 0.5;

// ============================================================
// 状态
// ============================================================
function freshState(){
  return {
    ess:0, totalEss:0,
    lv:1, exp:0,
    floorIdx:0, monIdx:0,
    kills:{}, skills:[],
    slots:[{skill:null,cond:'always'},{skill:null,cond:'always'},{skill:null,cond:'always'}],
    atk:5, hpMax:50, hp:50, crit:5, spdLv:0,
    upAtkLv:0, upHpLv:0, upCritLv:0,
    autoAdv:true, bestFloor:0,
    evMod:null, evFloor:-1,
    eps:0.5, lastSeen:Date.now(), offSum:null,
  };
}
let S = null;

function slotCount(){
  return 1 + SLOT_UNLOCK.filter(function(n){ return S.skills.length >= n; }).length;
}

// ---------- 运行时 ----------
const R = {
  monHp:0, monHpMax:1,
  monTimer:0, atkTimer:0, atkCount:0,
  shield:0,
  hasteUntil:0, armorUntil:0, poisonUntil:0, poisonDps:0, poisonAcc:0,
  cds:{},
  fightStart:0, fightSkillUses:0,
  fightId:0, slKey:'', reviveAt:0,
  paused:false, evOpts:[], evUntil:0,
  regenTimer:0, meBurnUntil:0, meBurnDps:0, meBurnAcc:0, affixSuppress:false,
  killGate:0,               // 自动推进：本层已杀多少只
  dead:false,
};
let dirty = true, lastRender = 0;
function markDirty(){ dirty = true; }

// ---------- 当前层 / 当前怪 ----------
function curFloor(){ return floorDef(S.floorIdx); }

function curMon(){
  const f = curFloor();
  const e = f.monsters[Math.min(S.monIdx, f.monsters.length-1)];
  const t = e.tpl;
  const mult = e.mult || 1;
  const atkMult = e.atkMult || mult;
  const essMult = e.essMult || mult;
  // 同层怪不再随击杀变强：难度只由层数决定
  const ev = (S.evFloor === S.floorIdx && S.evMod) ? S.evMod : {};
  const evHp = ev.hp || 1, evAtk = ev.atk || 1, evEss = ev.ess || 1;
  let aff = R.forceAffixes || e.affixes || [];
  if(ev.noAffix || R.affixSuppress) aff = [];
  return {name:t.name, emoji:t.emoji, skill:t.skill,
    affixes: aff,
    hpMax: Math.round(t.hp * mult * evHp),
    atk: Math.round(t.atk * atkMult * evAtk),
    ess: Math.round(t.ess * essMult * evEss)};
}

// ---------- 派生 ----------
function derived(){
  const has = function(id){ return S.skills.indexOf(id) >= 0; };
  const lvMulA = 1 + 0.025*(S.lv-1);
  const lvMulE = 1 + 0.012*(S.lv-1);
  const rm = REALMS[realmOf(S.lv)].mul;
  const rift = Math.pow(CFG.riftGrow, Math.max(0, S.bestFloor));
  const total = rm * rift;
  return {
    atk: Math.round(S.atk * lvMulA * total),
    hpMax: Math.round(S.hpMax * lvMulA * total),
    crit: S.crit,
    critDmg: has('rend') ? 1.8 : 1.5,
    atkInterval: Math.max(CFG.minInterval, 900 * Math.pow(0.92, S.spdLv)),
    essMul: lvMulE * total,
    atkMul: lvMulA * total,
    realmMul: rm,
    riftMul: rift,
  };
}

// ============================================================
// 工具
// ============================================================
let CLOCK = 0;                     // 快进模拟用的虚拟时钟偏移
function now(){ return performance.now() + CLOCK; }

// 大数显示：1.2万 / 3.4亿 / 5.6万亿
function fmt(n){
  n = Math.max(0, Math.round(n));
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/1e4).toFixed(n<1e6?1:0) + '万';
  if(n < 1e12) return (n/1e8).toFixed(n<1e10?1:0) + '亿';
  if(n < 1e16) return (n/1e12).toFixed(1) + '万亿';
  return (n/1e16).toFixed(2) + '京';
}

let SILENT = false;      // 快进模拟时关掉 DOM 输出
function log(msg, cls){
  if(SILENT) return;
  const el = document.getElementById('log');
  if(!el) return;
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = msg;
  el.insertBefore(d, el.firstChild);
  while(el.children.length > 50) el.removeChild(el.lastChild);
}
function floatDmg(text, kind){
  if(SILENT) return;
  const card = document.getElementById('monsterCard');
  if(!card) return;
  if(card.querySelectorAll('.dmg').length > 5) return;   // 同屏最多 6 个飘字
  const d = document.createElement('div');
  d.className = 'dmg ' + (kind || 'normal');
  d.textContent = text;
  d.style.left = (45 + Math.random()*10) + '%';
  card.appendChild(d);
  setTimeout(function(){ d.remove(); }, 800);
}
function flash(){ if(SILENT) return; const f=document.createElement('div'); f.className='flash';
  document.body.appendChild(f); setTimeout(function(){f.remove();},950); }
function toast(msg){ if(SILENT) return; const t=document.createElement('div'); t.className='toast';
  t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},1850); }

function save(){
  try{
    S.lastSeen = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      S = Object.assign(freshState(), p);
      if(!Array.isArray(S.slots) || S.slots.length !== 3) S.slots = freshState().slots;
      if(!Array.isArray(S.skills)) S.skills = [];
      return true;
    }
  }catch(e){}
  S = freshState();
  return false;
}

// ============================================================
// 战斗
// ============================================================
function startFight(){
  const m = curMon();
  R.monHpMax = m.hpMax; R.monHp = m.hpMax;
  R.monTimer = 0; R.atkTimer = 0; R.atkCount = 0;
  R.shield = 0;
  R.regenTimer = 0; R.meBurnUntil = 0; R.meBurnAcc = 0;
  R.fightStart = now(); R.fightSkillUses = 0;
  R.fightId++;
  render();
  dirty = false; lastRender = now();
}

function hasAffix(k){
  const m = curMon();
  return (m.affixes || []).indexOf(k) >= 0;
}

function damageMonster(dmg, tag){
  const m = curMon();
  // 免疫：开战 3 秒内打不动
  if((m.affixes||[]).indexOf('immune') >= 0 && now() - R.fightStart < 3000){
    floatDmg('免疫', 'skill');
    markDirty();
    return false;
  }
  // 反伤：按伤害比例反弹，但设上限，避免高伤害自杀
  if((m.affixes||[]).indexOf('thorns') >= 0 && dmg > 0){
    const D2 = derived();
    const back = Math.min(Math.round(dmg*0.18), Math.round(D2.hpMax*0.05));
    if(back > 0 && !R.dead){
      S.hp -= back;
      floatDmg('反 ' + fmt(back), 'crit');
      if(S.hp <= 0){ S.hp = 1; }      // 反伤不直接打死，留 1 血
    }
  }
  R.monHp -= dmg;
  floatDmg((tag ? tag + ' ' : '') + '-' + fmt(dmg), tag ? 'skill' : 'normal');
  if(R.monHp <= 0){ R.monHp = 0; killMonster(); return true; }
  markDirty();
  return false;
}

function playerAttack(){
  const D = derived();
  const isCrit = Math.random()*100 < D.crit;
  const dmg = isCrit ? Math.round(D.atk*D.critDmg) : D.atk;
  R.atkCount++;
  damageMonster(dmg, isCrit ? '暴击' : '');
}

function gainExp(n){
  S.exp += n;
  let ups = 0;
  while(S.lv < LV_MAX && S.exp >= expNeed(S.lv)){
    S.exp -= expNeed(S.lv);
    S.lv++;
    S.hp = derived().hpMax;      // 升级回满（血量统一按有效值存）
    ups++;
    if(realmOf(S.lv) !== realmOf(S.lv-1)){
      const rm = REALMS[realmOf(S.lv)];
      flash(); toast('境界突破 · ' + rm.name);
      log('【境界突破】' + rm.name + '（Lv.' + S.lv + '）' + rm.bonus, 'c-epic');
    }
  }
  return ups;
}

function killMonster(){
  const m = curMon();
  const D = derived();
  const dur = ((now() - R.fightStart)/1000).toFixed(1);
  const deepGap = Math.max(0, S.bestFloor - S.floorIdx);   // 比最深纪录低几层
  const farmMul = Math.max(CFG.farmMin, 1 - CFG.farmDecay*deepGap);
  const essGain = Math.round(m.ess * D.essMul * farmMul);
  const expGain = Math.max(1, Math.round(m.ess * CFG.expRatio * farmMul));

  S.ess += essGain; S.totalEss += essGain;
  S.kills[m.name] = (S.kills[m.name] || 0) + 1;
  const k = S.kills[m.name];
  gainExp(expGain);

  // eps 平滑估计（给离线收益用）
  const dtSec = Math.max(0.5, (now()-R.fightStart)/1000);
  const inst = essGain / (dtSec + 1.7);
  S.eps = S.eps*0.85 + inst*0.15;

  const lf = document.getElementById('sLast');
  if(lf) lf.textContent = dur + 's · ' + R.fightSkillUses + ' 技能';

  log('击杀 ' + m.name + '｜' + dur + 's｜+' + fmt(essGain) + ' 精华｜+' + fmt(expGain) + ' 经验' +
      (deepGap > 0 ? '（低层衰减 ×' + farmMul.toFixed(2) + '）' : ''), 'c-good');

  // 吞噬技能
  if(k === KILLS_PER_TRAIT && S.skills.indexOf(m.skill) < 0){
    S.skills.push(m.skill);
    const sk = SKILLS[m.skill];
    flash(); toast('吞噬完成 · ' + sk.icon + ' ' + sk.name);
    log('【吞噬进化】习得技能：' + sk.name + ' —— ' + sk.desc, 'c-epic');
    if(S.skills.length === SLOT_UNLOCK[0] || S.skills.length === SLOT_UNLOCK[1]){
      log('【系统】战术槽位 +1（当前 ' + slotCount() + ' 槽）', 'c-epic');
      toast('战术槽位 +1');
    }
  }

  // 自动推进：打得太慢就原地刷，不再硬顶
  R.killGate++;
  const tooSlow = parseFloat(dur) > CFG.advSecLimit;
  if(S.autoAdv && R.killGate >= KILLS_PER_TRAIT && !tooSlow){
    R.killGate = 0;
    advance(true);
    return;
  }
  if(tooSlow && R.killGate >= KILLS_PER_TRAIT){
    R.killGate = 0;
    if(!R.slowNoticed){
      R.slowNoticed = true;
      log('【停滞】这一层打得太慢，自动改为原地刷精华（攒够再推进）', 'c-bad');
    }
  }
  startFight(); save();
}

function maybeEvent(){
  const f = S.floorIdx + 1;
  if(f % 5 !== 0 || f < 5) return;
  const pool = EVENTS.slice();
  const opts = [];
  for(let i=0;i<3 && pool.length;i++){
    const idx = Math.floor(seededRand(f*31 + i*17 + 5) * pool.length) % pool.length;
    opts.push(pool.splice(idx,1)[0]);
  }
  R.evOpts = opts;
  R.evUntil = now() + 15000;          // 15 秒不选，自动挑最稳的
  R.paused = true;
  const sheet = document.getElementById('sheet');
  if(sheet){
    sheet.innerHTML = optionsHTML(opts);
    document.getElementById('overlay').classList.add('on');
  }
  markDirty();
}

function optionsHTML(opts){
  return '<h4>裂隙事件 · 第 ' + (S.floorIdx+1) + ' 层</h4>' +
    '<div class="od" style="color:#5a6b80;font-size:11px;margin-bottom:10px">' +
    '15 秒不选将自动选择最稳的一项</div>' +
    opts.map(function(o,i){
      return '<div class="opt" onclick="chooseEvent(' + i + ')">' +
        '<div class="oi">' + o.icon + '</div>' +
        '<div class="ot">' + o.name + '<div class="od">' + o.desc + '</div></div></div>';
    }).join('') +
    '<div class="od" id="evCountdown" style="text-align:center;color:#7aa2f7;margin-top:8px"></div>';
}

window.chooseEvent = function(i){
  const o = R.evOpts[i];
  if(!o) return;
  R.paused = false;
  R.evOpts = [];
  closePicker();
  S.evFloor = S.floorIdx;
  S.evMod = Object.assign({}, o.mod);
  if(o.cost === 'hp30'){
    S.hp = Math.max(1, Math.round(S.hp * 0.7));
  }
  if(o.special === 'echo'){
    const missing = TEMPLATES.map(function(t){ return t.skill; })
      .filter(function(k){ return S.skills.indexOf(k) < 0; });
    if(!missing.length || Math.random() < 0.3){
      log('【残响】吞噬失败，什么都没得到', 'c-bad');
    } else {
      const got = missing[Math.floor(Math.random()*missing.length)];
      S.skills.push(got);
      flash(); toast('吞噬完成 · ' + SKILLS[got].name);
      log('【残响】直接习得技能：' + SKILLS[got].name, 'c-epic');
    }
  }
  log('【事件】' + o.icon + ' ' + o.name + ' —— ' + o.desc, 'c-skill');
  startFight(); save();
};

function advance(silent){
  const f = curFloor();
  if(S.floorIdx > S.bestFloor) S.bestFloor = S.floorIdx;
  if(S.monIdx < f.monsters.length - 1){
    S.monIdx++;
  } else {
    S.floorIdx = Math.min(CFG.floorCap-1, S.floorIdx+1); S.monIdx = 0;
    if(S.floorIdx > S.bestFloor){ S.bestFloor = S.floorIdx; R.slowNoticed = false; }
    R.affixSuppress = false;
    const nf = curFloor();
    if(nf.affixes && nf.affixes.length){
      log('【词缀】' + nf.affixes.map(function(k){ return AFFIXES[k].icon + AFFIXES[k].name; }).join(' + ') +
          ' —— ' + AFFIXES[nf.affixes[0]].desc, 'c-skill');
    }
    if(!silent) log('【进入】' + curFloor().name, 'c-epic');
    else log('【深入】进入 ' + curFloor().name + '（' + curFloor().tier + '）', 'c-epic');
  }
  R.killGate = 0;
  startFight();
  maybeEvent();
  save();
}

function monsterAttack(){
  const D = derived();
  const m = curMon();
  const aff = m.affixes || [];
  let raw = m.atk;
  // 狂暴：自身残血时攻击翻倍
  if(aff.indexOf('enrage') >= 0 && R.monHp / Math.max(1,R.monHpMax) < 0.35) raw *= 2;
  let dmg = raw * (now() < R.armorUntil ? 0.5 : 1);
  dmg = Math.max(1, Math.round(dmg));
  // 吸血：攻击后回复自身生命
  if(aff.indexOf('leech') >= 0 && R.monHp > 0){
    R.monHp = Math.min(R.monHpMax, R.monHp + Math.round(R.monHpMax*0.04));
  }
  // 灼烧：给对方挂持续伤害
  if(aff.indexOf('burn') >= 0){
    R.meBurnUntil = now() + 3000;
    R.meBurnDps = Math.max(1, Math.round(m.atk*0.25));
  }

  if(R.shield > 0){
    const ab = Math.min(R.shield, dmg);
    R.shield -= ab; dmg -= ab;
    if(ab > 0) floatDmg('盾 -' + ab, 'skill');
  }
  if(dmg > 0) S.hp -= dmg;

  if(S.hp <= 0){
    S.hp = 0; R.dead = true;
    R.reviveAt = now() + 1500;
    R.deaths = (R.deaths || 0) + 1;
    log('【重伤】被 ' + m.name + ' 击退，回营地恢复', 'c-bad');
    if(R.deaths >= 3 && !R.affixSuppress){
      R.deaths = 0;
      R.affixSuppress = true;
      log('【洞察】你摸清了这只怪的规律，本层词缀暂时失效', 'c-epic');
      R.monHp = curMon().hpMax; R.monHpMax = curMon().hpMax;
      setTimeout(function(){ R.monHp = curMon().hpMax; R.monHpMax = curMon().hpMax; }, 0);
    }
    render(); dirty = false; lastRender = now();
    return;
  }
  markDirty();
}

function castSkill(id){
  const D = derived();
  const sk = SKILLS[id];
  const m = curMon();
  R.cds[id] = now() + sk.cd;
  R.fightSkillUses++;

  if(id === 'harden'){
    R.shield += Math.round(D.hpMax*0.2);
  } else if(id === 'bloodthirst'){
    const heal = Math.round(D.hpMax*0.1);
    S.hp = Math.min(D.hpMax, S.hp + heal);
    floatDmg('+' + heal, 'skill');
  } else if(id === 'haste'){
    R.hasteUntil = now() + 5000;
  } else if(id === 'rend'){
    damageMonster(Math.round(D.atk*2.2), '裂爪');
  } else if(id === 'venom'){
    R.poisonUntil = now() + 6000; R.poisonDps = Math.max(1, Math.round(D.atk*0.3));
  } else if(id === 'ironwall'){
    R.armorUntil = now() + 5000;
  } else if(id === 'triple'){
    (function(fid){
      for(let i=0;i<3;i++){
        setTimeout(function(){
          if(fid !== R.fightId) return;
          if(R.monHp > 0) damageMonster(Math.round(D.atk*0.6), '连斩');
        }, i*130);
      }
    })(R.fightId);
  } else if(id === 'crush'){
    damageMonster(Math.round(D.atk*3.0), '碎骨');
    if(S.hp > 1) S.hp = Math.max(1, S.hp - Math.round(D.hpMax*0.05));
  } else if(id === 'soul'){
    const g = Math.round(m.ess*3*D.essMul);
    S.ess += g;
    floatDmg('+' + g + '精华', 'skill');
  }

  let condLabel = '无条件';
  for(let i=0;i<3;i++) if(S.slots[i].skill === id) condLabel = CONDS[S.slots[i].cond].label;
  log('【' + sk.name + '】' + condLabel, 'c-skill');
  markDirty();
}

function checkSkills(){
  const D = derived();
  const ctx = {
    monPct: R.monHp / Math.max(1, R.monHpMax),
    mePct: S.hp / Math.max(1, D.hpMax),
    atkCount: R.atkCount,
  };
  const cnt = slotCount();
  for(let i=0;i<cnt;i++){
    const slot = S.slots[i];
    if(!slot.skill) continue;
    if((R.cds[slot.skill] || 0) > now()) continue;
    if(!CONDS[slot.cond].test(ctx)) continue;
    castSkill(slot.skill);
    if(R.monHp <= 0) return;
  }
}

// ---------- 单步推进（真实循环与离线模拟共用） ----------
function tick(dt){
  if(R.paused){
    const cd = document.getElementById('evCountdown');
    if(!SILENT && cd){
      const left = Math.max(0, Math.ceil((R.evUntil - now())/1000));
      cd.textContent = '自动选择倒计时 ' + left + ' 秒';
    }
    if(now() >= R.evUntil){
      // 默认挑一个不带代价的（瘠薄 > 狂潮 > 第一个）
      let pick = R.evOpts.findIndex(function(o){ return o.id === 'thin'; });
      if(pick < 0) pick = R.evOpts.findIndex(function(o){ return !o.cost; });
      if(pick < 0) pick = 0;
      chooseEvent(pick);
    }
    return;
  }
  if(R.dead){
    if(now() >= R.reviveAt){
      R.dead = false;
      S.hp = derived().hpMax;
      R.monHp = R.monHpMax; R.fightStart = now(); R.fightSkillUses = 0;
      markDirty();
    }
    return;
  }
  // 再生
  const affNow = (curMon().affixes || []);
  if(R.monHp > 0 && R.monHp < R.monHpMax && affNow.indexOf('regen') >= 0){
    R.regenTimer += dt;
    if(R.regenTimer >= 4000){
      R.regenTimer = 0;
      R.monHp = Math.min(R.monHpMax, R.monHp + Math.round(R.monHpMax*0.06));
      floatDmg('再生', 'skill');
      markDirty();
    }
  }
  // 玩家灼烧
  if(now() < R.meBurnUntil){
    R.meBurnAcc += dt;
    if(R.meBurnAcc >= 1000){
      R.meBurnAcc = 0;
      S.hp -= R.meBurnDps;
      floatDmg('灼 -' + fmt(R.meBurnDps), 'normal');
      if(S.hp <= 0) S.hp = 1;
      markDirty();
    }
  }
  if(R.monHp > 0 && now() < R.poisonUntil){
    R.poisonAcc += dt;
    if(R.poisonAcc >= 1000){
      R.poisonAcc = 0;
      damageMonster(R.poisonDps, '毒');
    }
  }
  if(!R.dead && R.monHp > 0){
    const D = derived();
    const interval = now() < R.hasteUntil ? D.atkInterval*0.5 : D.atkInterval;
    R.atkTimer += dt;
    if(R.atkTimer >= interval){ R.atkTimer = 0; playerAttack(); }
  }
  if(!R.dead && R.monHp > 0) checkSkills();
  if(!R.dead && R.monHp > 0){
    R.monTimer += dt;
    if(R.monTimer >= 1700){ R.monTimer = 0; monsterAttack(); }
  }
}

let last = performance.now();
function loop(t){
  const dt = Math.min(150, t - last); last = t;
  tick(dt);
  if(dirty && t - lastRender >= 80){
    render(); dirty = false; lastRender = t;
  }
  requestAnimationFrame(loop);
}

// ============================================================
// 渲染
// ============================================================
function render(){
  const D = derived();
  if(S.hp > D.hpMax) S.hp = D.hpMax;
  const m = curMon();
  const f = curFloor();
  const killed = S.kills[m.name] || 0;
  const hasSkill = S.skills.indexOf(m.skill) >= 0;
  const pct = Math.max(0, R.monHp / Math.max(1, R.monHpMax));
  const ri = realmOf(S.lv);

  document.getElementById('realmName').textContent = REALMS[ri].name;
  document.getElementById('lvNum').textContent = S.lv;
  document.getElementById('ess').textContent = fmt(S.ess);
  document.getElementById('floorIdx').textContent = S.floorIdx + 1;

  document.getElementById('monEmoji').textContent = m.emoji;
  document.getElementById('monName').textContent = m.name;
  const st = document.getElementById('monStage');
  st.textContent = (hasSkill ? '已吞噬 · 技能已获得 · ' : '') +
    '本层 ' + R.killGate + '/' + KILLS_PER_TRAIT + ' 只后推进';
  st.style.color = hasSkill ? '#a78bfa' : '#5a6b80';

  // 词缀标签
  const ar = document.getElementById('affixRow');
  const affs = m.affixes || [];
  const evTag = (S.evFloor === S.floorIdx && S.evMod)
    ? 'ev' + JSON.stringify(S.evMod) : '';
  const affKey = affs.join(',') + '|' + evTag;
  if(ar.dataset.k !== affKey){
    ar.dataset.k = affKey;
    ar.innerHTML = affs.map(function(k){
      const a = AFFIXES[k];
      return '<span style="font-size:10.5px;padding:3px 8px;border-radius:20px;' +
        'background:rgba(224,128,128,.12);border:1px solid rgba(224,128,128,.35);color:#e8b0b0">' +
        a.icon + ' ' + a.name + '</span>';
    }).join('');
    const evMod = (S.evFloor === S.floorIdx && S.evMod) ? S.evMod : null;
    let extra = '';
    if(evMod){
      const bits = [];
      if(evMod.hp) bits.push('生命×' + evMod.hp);
      if(evMod.atk) bits.push('攻击×' + evMod.atk);
      if(evMod.ess) bits.push('精华×' + evMod.ess);
      if(evMod.noAffix) bits.push('无词缀');
      extra = '<span style="font-size:10.5px;padding:3px 8px;border-radius:20px;' +
        'background:rgba(122,162,247,.12);border:1px solid rgba(122,162,247,.35);color:#a8c4f0">' +
        '◆ ' + bits.join(' ') + '</span>';
    }
    ar.innerHTML = ar.innerHTML + extra;
  }

  document.getElementById('monHpBar').style.width = (pct*100) + '%';
  document.getElementById('monHpTxt').textContent = fmt(Math.max(0,R.monHp)) + ' / ' + fmt(R.monHpMax);

  const mePct = Math.max(0, S.hp / D.hpMax);
  document.getElementById('meHpBar').style.width = (mePct*100) + '%';
  document.getElementById('meHpBar').style.background = mePct < 0.3
    ? 'linear-gradient(90deg,#a33,#e08080)' : 'linear-gradient(90deg,#3f8f5f,#7dd3a0)';
  document.getElementById('meHpTxt').textContent = '你 ' + fmt(S.hp) + ' / ' + fmt(D.hpMax);

  const sb = document.getElementById('shieldBar');
  if(R.shield > 0){
    sb.style.display = 'block';
    document.getElementById('shieldFill').style.width = Math.min(100, R.shield/D.hpMax*100) + '%';
  } else sb.style.display = 'none';

  // 修行
  const need = expNeed(S.lv);
  const ep = S.lv >= LV_MAX ? 1 : S.exp / need;
  document.getElementById('expBar').style.width = Math.min(100, ep*100) + '%';
  document.getElementById('expTxt').textContent = S.lv >= LV_MAX ? '已满级'
    : fmt(S.exp) + ' / ' + fmt(need) + ' 经验';
  document.getElementById('realmHint').textContent = S.lv >= LV_MAX ? '神级 · 满级'
    : REALMS[ri].name + ' · 距下一境界 ' + (REALMS[Math.min(REALMS.length-1, ri+1)].from - S.lv) + ' 级';
  document.getElementById('realmMul').textContent = '×' + D.realmMul.toFixed(2);
  document.getElementById('atkMul').textContent = '×' + D.atkMul.toFixed(2);
  document.getElementById('essMul').textContent = '×' + D.essMul.toFixed(2);
  document.getElementById('riftMul').textContent = '×' + D.riftMul.toFixed(2);
  const gap = Math.max(0, S.bestFloor - S.floorIdx);
  const fm = Math.max(CFG.farmMin, 1 - CFG.farmDecay*gap);
  const fmEl = document.getElementById('farmMul');
  fmEl.textContent = '×' + fm.toFixed(2) + (gap > 0 ? '（低 ' + gap + ' 层）' : '');
  fmEl.style.color = gap > 0 ? '#e0a080' : '#e6edf7';

  // 战术槽
  const cnt = slotCount();
  document.getElementById('slotHint').textContent = cnt + ' / 3 槽位';
  const sl = document.getElementById('slotList');
  const slKey = cnt + '|' + S.slots.map(function(s){ return (s.skill||'-') + ':' + s.cond; }).join(',');
  if(slKey !== R.slKey){
    R.slKey = slKey;
    sl.innerHTML = S.slots.map(function(s, i){
      if(i >= cnt){
        return '<div class="slot locked"><div class="sicon">🔒</div>' +
          '<div class="sinfo"><div class="sname none">未解锁</div>' +
          '<div class="scond">吞噬 ' + SLOT_UNLOCK[i-1] + ' 个技能解锁</div></div></div>';
      }
      if(!s.skill){
        return '<div class="slot empty" onclick="openPicker(' + i + ')"><div class="sicon">＋</div>' +
          '<div class="sinfo"><div class="sname none">空槽位</div>' +
          '<div class="scond">点击配置技能与触发条件</div></div><div class="sarrow">›</div></div>';
      }
      const sk = SKILLS[s.skill];
      return '<div class="slot" onclick="openPicker(' + i + ')"><div class="sicon">' + sk.icon + '</div>' +
        '<div class="sinfo"><div class="sname">' + sk.name + '</div>' +
        '<div class="scond">' + CONDS[s.cond].label + '</div></div><div class="sarrow">›</div></div>';
    }).join('');
  }

  document.getElementById('sAtk').textContent = fmt(D.atk);
  document.getElementById('sHp').textContent = fmt(S.hp) + ' / ' + fmt(D.hpMax);
  document.getElementById('sCrit').textContent = D.crit + '%';
  document.getElementById('sEps').textContent = S.eps < 10000 ? S.eps.toFixed(1) : fmt(S.eps);

  const costs = {
    atk: Math.round(12*Math.pow(CFG.upCostGrow, S.upAtkLv)),
    hp:  Math.round(12*Math.pow(CFG.upCostGrow, S.upHpLv)),
    crit:Math.round(30*Math.pow(1.55, S.upCritLv)),
    speed:Math.round(40*Math.pow(1.40, S.spdLv)),
  };
  setBtn('uAtk', costs.atk, 'cAtk');
  setBtn('uHp', costs.hp, 'cHp');
  setBtn('uCrit', costs.crit, 'cCrit', S.crit >= CFG.critMax ? '已满' : null);
  setBtn('uSpeed', costs.speed, 'cSpeed', S.spdLv >= CFG.spdMax ? '已满' : null);

  document.getElementById('autoTxt').textContent = R.dead ? '恢复中…'
    : (S.autoAdv ? '自动战斗中 · 自动推进已开' : '自动战斗中 · 手动推进');
  const ba = document.getElementById('btnAuto');
  ba.textContent = '自动推进：' + (S.autoAdv ? '开' : '关');
  ba.classList.toggle('on', !!S.autoAdv);
}

function setBtn(id, cost, costId, maxedLabel){
  const btn = document.getElementById(id);
  if(!btn) return;
  if(maxedLabel){
    btn.disabled = true; btn.classList.remove('can');
    const el = document.getElementById(costId);
    if(el) el.textContent = maxedLabel;
    return;
  }
  const can = S.ess >= cost;
  btn.disabled = !can;
  btn.classList.toggle('can', can);
  const c = document.getElementById(costId);
  if(c) c.textContent = fmt(cost) + ' 精华';
}

// ============================================================
// 槽位配置
// ============================================================
window.openPicker = function(slotIdx){
  const slot = S.slots[slotIdx];
  const owned = S.skills;
  const taken = {};
  S.slots.forEach(function(s, i){ if(i !== slotIdx && s.skill) taken[s.skill] = true; });

  let html = '<h4>槽位 ' + (slotIdx+1) + ' · 技能</h4>';
  if(owned.length === 0){
    html += '<div class="opt lock"><div class="ot">还没有吞噬任何技能' +
      '<div class="od">把同类怪物击杀 10 只即可吞噬</div></div></div>';
  } else {
    owned.forEach(function(id){
      const sk = SKILLS[id];
      const isTaken = !!taken[id];
      html += '<div class="opt ' + (slot.skill === id ? 'sel' : '') + ' ' + (isTaken ? 'lock' : '') + '" ' +
        (isTaken ? '' : 'onclick="setSlotSkill(' + slotIdx + ',\'' + id + '\')"') + '>' +
        '<div class="oi">' + sk.icon + '</div>' +
        '<div class="ot">' + sk.name + '<div class="od">' + sk.desc + '</div></div>' +
        '<div class="od">' + (isTaken ? '已在其它槽' : 'CD ' + (sk.cd/1000) + 's') + '</div></div>';
    });
  }
  html += '<h4 style="margin-top:16px">触发条件</h4>';
  Object.keys(CONDS).forEach(function(k){
    html += '<div class="opt ' + (slot.cond === k ? 'sel' : '') + '" onclick="setSlotCond(' + slotIdx + ',\'' + k + '\')">' +
      '<div class="oi">◈</div><div class="ot">' + CONDS[k].label + '</div></div>';
  });
  html += '<div class="opt" onclick="clearSlot(' + slotIdx + ')"><div class="oi">✕</div>' +
    '<div class="ot">清空此槽位</div></div>' +
    '<button class="close" onclick="closePicker()">完成</button>';

  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('on');
};

window.setSlotSkill = function(i, id){
  S.slots.forEach(function(s, idx){ if(idx !== i && s.skill === id) s.skill = null; });
  S.slots[i].skill = id;
  render(); save();
  log('【战术】槽位 ' + (i+1) + ' 配置为 ' + SKILLS[id].name, 'c-skill');
};
window.setSlotCond = function(i, cond){ S.slots[i].cond = cond; render(); save(); };
window.clearSlot = function(i){ S.slots[i].skill = null; render(); save(); };
window.closePicker = function(){ document.getElementById('overlay').classList.remove('on'); };
window.closeOffline = function(){ document.getElementById('offlineBox').classList.remove('on'); };

// ============================================================
// 交互
// ============================================================
function buyAtk(){
  const c = Math.round(12*Math.pow(CFG.upCostGrow, S.upAtkLv));
  if(S.ess < c) return false;
  S.ess -= c; S.upAtkLv++;
  S.atk += Math.round(2*Math.pow(CFG.upPowGrow, S.upAtkLv));
  return true;
}
function buyHp(){
  const c = Math.round(12*Math.pow(CFG.upCostGrow, S.upHpLv));
  if(S.ess < c) return false;
  S.ess -= c; S.upHpLv++;
  S.hpMax += Math.round(10*Math.pow(CFG.upPowGrow, S.upHpLv));
  S.hp = derived().hpMax;        // 买血回满
  return true;
}
function buySpeed(){
  if(S.spdLv >= CFG.spdMax) return false;
  const c = Math.round(40*Math.pow(1.40, S.spdLv));
  if(S.ess < c) return false;
  S.ess -= c; S.spdLv++; return true;
}
function buyCrit(){
  if(S.crit >= CFG.critMax) return false;
  const c = Math.round(30*Math.pow(1.55, S.upCritLv));
  if(S.ess < c) return false;
  S.ess -= c; S.upCritLv++; S.crit += 1; return true;
}

document.getElementById('uAtk').onclick = function(){ if(buyAtk()){ render(); save(); } };
document.getElementById('uHp').onclick = function(){ if(buyHp()){ render(); save(); } };
document.getElementById('uCrit').onclick = function(){ if(buyCrit()){ render(); save(); } };
document.getElementById('uSpeed').onclick = function(){ if(buySpeed()){ render(); save(); } };

document.getElementById('btnNext').onclick = function(){ advance(false); };
document.getElementById('btnAuto').onclick = function(){
  S.autoAdv = !S.autoAdv;
  R.killGate = 0;
  render(); save();
};

document.getElementById('overlay').onclick = function(e){
  if(e.target.id === 'overlay') closePicker();
};

// ============================================================
// 离线收益
// ============================================================
function settleOffline(){
  if(!S.lastSeen) return;
  const sec = Math.min(OFF_CAP_SEC, Math.max(0, (Date.now() - S.lastSeen)/1000));
  if(sec < 60) return;                     // 少于 1 分钟不结算
  const ess = Math.round(S.eps * sec * OFF_RATE);
  const exp = Math.round(S.eps * sec * OFF_RATE * CFG.expRatio);
  if(ess <= 0) return;
  S.ess += ess; S.totalEss += ess;
  gainExp(exp);
  S.offSum = {sec:Math.round(sec), ess:ess, exp:exp};

  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  document.getElementById('offTime').textContent = (h>0 ? h+' 小时 ' : '') + m + ' 分';
  document.getElementById('offEss').textContent = '+' + fmt(ess) + ' 精华';
  document.getElementById('offExp').textContent = '+' + fmt(exp) + ' 经验';
  document.getElementById('offlineBox').classList.add('on');
}

// ============================================================
// 启动
// ============================================================
function boot(){
  const had = load();
  startFight();
  if(had){
    log('【系统】读取存档，继续自动战斗。');
    if(S.offSum){
      log('【离线】上次离线 ' + S.offSum.sec + ' 秒，补发了 ' + S.offSum.ess + ' 精华', 'c-epic');
      S.offSum = null;
    }
    settleOffline();
  } else {
    log('【系统】裂隙降临。战斗已全自动。');
    log('击杀给经验，经验升境界；同类杀 10 只吞噬技能。');
  }
  render();
  requestAnimationFrame(loop);
  setInterval(function(){ save(); }, 10000);
}
boot();

// ============================================================
// 测试用快进（无渲染、无动画，纯逻辑）
// ============================================================
window.__sim = function(seconds, autoBuy){
  const prevSilent = SILENT; SILENT = true;
  const step = 50, n = Math.round(seconds*1000/step);
  const startFloor = S.floorIdx;
  for(let i=0;i<n;i++){
    CLOCK += step;
    tick(step);
    if(autoBuy && i % 20 === 0){
      for(let guard=0; guard<80; guard++){
        const fns = [buyAtk, buyHp, buySpeed, buyCrit];
        const costs = [
          Math.round(12*Math.pow(CFG.upCostGrow,S.upAtkLv)),
          Math.round(12*Math.pow(CFG.upCostGrow,S.upHpLv)),
          Math.round(40*Math.pow(1.40,S.spdLv)),
          Math.round(30*Math.pow(1.55,S.upCritLv)),
        ];
        const capped = [false,false, S.spdLv>=CFG.spdMax, S.crit>=CFG.critMax];
        let idx = -1;
        for(let j=0;j<costs.length;j++){
          if(capped[j]) continue;
          if(idx < 0 || costs[j] < costs[idx]) idx = j;
        }
        if(idx < 0) break;
        if(S.ess < costs[idx]) break;
        fns[idx]();
      }
    }
  }
  SILENT = prevSilent;
  return {floor:S.floorIdx+1, lv:S.lv, realm:REALMS[realmOf(S.lv)].name,
    ess:S.ess, atk:derived().atk, hp:derived().hpMax,
    kills:Object.values(S.kills).reduce(function(a,b){return a+b;},0),
    skills:S.skills.length, monHp:Math.ceil(R.monHp), eps:+S.eps.toFixed(2)};
};
