<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>吞噬进化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0e14;color:#c8d3e0;min-height:100vh;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 50% 0%,#141d2b 0%,#0a0e14 60%);
}
#app{max-width:480px;margin:0 auto;padding:10px 12px 112px}

.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:rgba(20,29,43,.7);border:1px solid #1e2b3d;
  border-radius:10px;margin-bottom:10px;font-size:13px}
.topbar .ess{color:#7dd3a0;font-weight:600}
.topbar .floor{color:#7aa2f7}

.monster{background:linear-gradient(180deg,#141d2b 0%,#0f1620 100%);
  border:1px solid #1e2b3d;border-radius:14px;padding:14px;margin-bottom:10px;
  position:relative;overflow:hidden}
.monster::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(122,162,247,.08),transparent 70%);
  pointer-events:none}
.mon-name{font-size:17px;font-weight:700;color:#e6edf7;margin-bottom:2px;text-align:center}
.mon-stage{font-size:11px;color:#5a6b80;text-align:center;margin-bottom:10px}
.mon-emoji{font-size:52px;text-align:center;line-height:1.15;margin-bottom:8px;
  filter:drop-shadow(0 0 14px rgba(122,162,247,.35))}
.bar{background:#0a0e14;border-radius:6px;height:16px;overflow:hidden;
  border:1px solid #1e2b3d;position:relative;margin-bottom:6px}
.bar-fill{height:100%;transition:width .18s linear;border-radius:5px}
.bar-fill.hp-mon{background:linear-gradient(90deg,#e05252,#f28b8b)}
.bar-fill.hp-me{background:linear-gradient(90deg,#3f8f5f,#7dd3a0)}
.bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#e6edf7;text-shadow:0 1px 2px #000}
.bar.shield{height:6px;margin-top:-3px;margin-bottom:8px;border-color:#2b3f5c}
.bar.shield .bar-fill{background:linear-gradient(90deg,#4a7fd4,#8fb8f0)}

.auto-tag{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;color:#7dd3a0;padding:8px;margin-bottom:10px;
  background:rgba(63,143,95,.1);border:1px solid rgba(63,143,95,.3);border-radius:9px}
.dot{width:6px;height:6px;border-radius:50%;background:#7dd3a0;
  animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.panel{background:rgba(20,29,43,.55);border:1px solid #1e2b3d;border-radius:12px;
  padding:12px;margin-bottom:10px}
.panel h3{font-size:12px;color:#5a6b80;font-weight:600;letter-spacing:1px;margin-bottom:10px;
  display:flex;justify-content:space-between}
.panel h3 .hint{color:#3d4d61;font-weight:500;letter-spacing:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
  font-size:13px;border-bottom:1px solid rgba(30,43,61,.6)}
.row:last-child{border-bottom:none}
.row .k{color:#8a9bb0}
.row .v{color:#e6edf7;font-weight:600;font-variant-numeric:tabular-nums}

.upg{display:flex;flex-wrap:wrap;gap:8px}
.upg button{flex:1 1 calc(50% - 4px);padding:12px 8px;border-radius:10px;cursor:pointer;
  background:#16202e;border:1px solid #22303f;color:#c8d3e0;
  font-size:13px;font-weight:600;transition:.12s;font-family:inherit}
.upg button:active{transform:scale(.96)}
.upg button.can{border-color:#3f8f5f;background:rgba(63,143,95,.15);color:#a7e3bd}
.upg button:disabled{opacity:.4}
.upg .cost{display:block;font-size:11px;color:#7dd3a0;margin-top:3px;font-weight:500}

.slot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  background:#101a26;border:1px solid #1e2b3d;margin-bottom:8px;cursor:pointer}
.slot:active{background:#16222f}
.slot.empty{border-style:dashed;opacity:.8}
.slot .sicon{font-size:20px;width:26px;text-align:center}
.slot .sinfo{flex:1;min-width:0}
.slot .sname{font-size:13px;font-weight:700;color:#c4a5ff;margin-bottom:2px}
.slot .scond{font-size:11px;color:#8a9bb0}
.slot .sarrow{color:#3d4d61;font-size:14px}
.slot.locked{opacity:.4;cursor:default}
.slot .sname.none{color:#5a6b80}

.log{max-height:132px;overflow-y:auto;font-size:11.5px;line-height:1.75;color:#8a9bb0;
  font-family:ui-monospace,Consolas,monospace}
.log div{padding:1px 0}
.log .c-good{color:#7dd3a0}
.log .c-bad{color:#e08080}
.log .c-epic{color:#c4a5ff;font-weight:600}
.log .c-skill{color:#8fb8f0}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:#22303f;border-radius:2px}

.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,20,.96);
  border-top:1px solid #1e2b3d;padding:8px 12px;display:flex;gap:8px;
  backdrop-filter:blur(12px);z-index:10}
.bottom button{flex:1;padding:11px;border-radius:9px;border:1px solid #22303f;
  background:#16202e;color:#8a9bb0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bottom button:active{transform:scale(.96)}

@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}}
.dmg{position:absolute;left:50%;top:40%;font-size:19px;font-weight:800;
  pointer-events:none;animation:floatUp .75s ease-out forwards;z-index:5;
  text-shadow:0 2px 6px #000}
.dmg.crit{font-size:26px;color:#ffd166}
.dmg.normal{color:#ff9d9d}
.dmg.skill{color:#9de3ff;font-size:22px}

@keyframes devourFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 65%);
  pointer-events:none;animation:devourFlash .9s ease-out;z-index:20}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);
  background:rgba(167,139,250,.95);color:#0a0e14;padding:10px 18px;border-radius:9px;
  font-size:13px;font-weight:700;z-index:30;pointer-events:none;
  box-shadow:0 6px 24px rgba(167,139,250,.4);animation:devourFlash 1.8s ease-out forwards}

.overlay{position:fixed;inset:0;background:rgba(4,7,11,.82);z-index:50;
  display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.sheet{width:100%;max-height:82vh;overflow-y:auto;background:#0f1620;
  border-top:1px solid #22303f;border-radius:16px 16px 0 0;padding:16px 14px 24px;
  animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h4{font-size:13px;color:#7aa2f7;margin-bottom:10px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:11px;border-radius:9px;
  background:#131d29;border:1px solid #1e2b3d;margin-bottom:7px;cursor:pointer;font-size:12.5px}
.opt:active{background:#1a2836}
.opt.sel{border-color:#7a5cd6;background:rgba(122,92,214,.16)}
.opt.lock{opacity:.35;cursor:default}
.opt .oi{font-size:17px;width:22px;text-align:center}
.opt .ot{flex:1}
.opt .od{font-size:10.5px;color:#7e8fa3;margin-top:2px}
.sheet .close{width:100%;padding:12px;border-radius:9px;border:1px solid #22303f;
  background:#16202e;color:#8a9bb0;font-size:13px;font-weight:600;margin-top:12px;
  cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>精华 <span class="ess" id="ess">0</span></div>
    <div>裂隙 <span class="floor" id="floorName">F</span> · 第<span id="floorIdx">1</span>层</div>
  </div>

  <div class="monster" id="monsterCard">
    <div class="mon-emoji" id="monEmoji">🐀</div>
    <div class="mon-name" id="monName">铁皮鼠</div>
    <div class="mon-stage" id="monStage">已吞噬 0 / 10</div>
    <div class="bar"><div class="bar-fill hp-mon" id="monHpBar" style="width:100%"></div>
      <div class="bar-txt" id="monHpTxt">20 / 20</div></div>
    <div class="bar" style="height:12px;margin-top:3px"><div class="bar-fill hp-me" id="meHpBar" style="width:100%"></div>
      <div class="bar-txt" style="font-size:9px;opacity:.8" id="meHpTxt">你 50 / 50</div></div>
    <div class="bar shield" id="shieldBar" style="display:none">
      <div class="bar-fill" id="shieldFill" style="width:0%"></div></div>
  </div>

  <div class="auto-tag"><span class="dot"></span><span id="autoTxt">自动战斗中</span></div>

  <div class="panel">
    <h3>战术 <span class="hint" id="slotHint">1 / 3 槽位</span></h3>
    <div id="slotList"></div>
  </div>

  <div class="panel">
    <h3>属性</h3>
    <div class="row"><span class="k">攻击力</span><span class="v" id="sAtk">5</span></div>
    <div class="row"><span class="k">生命</span><span class="v" id="sHp">50 / 50</span></div>
    <div class="row"><span class="k">暴击率</span><span class="v" id="sCrit">5%</span></div>
    <div class="row"><span class="k">上一战</span><span class="v" id="sLast">—</span></div>
  </div>

  <div class="panel">
    <h3>强化</h3>
    <div class="upg">
      <button id="uAtk">攻击 +2<span class="cost" id="cAtk">10 精华</span></button>
      <button id="uHp">生命 +10<span class="cost" id="cHp">10 精华</span></button>
      <button id="uCrit">暴击 +1%<span class="cost" id="cCrit">25 精华</span></button>
      <button id="uSpeed">攻速 +8%<span class="cost" id="cSpeed">40 精华</span></button>
    </div>
  </div>

  <div class="panel">
    <h3>战斗记录</h3>
    <div class="log" id="log"></div>
  </div>

</div>

<div class="bottom">
  <button id="btnNext">深入下一层</button>
  <button id="btnReset">重置</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// ============================================================
// 怪物表
// ============================================================
const FLOORS = [
  { tier:'F', name:'微光裂隙', monsters:[
    {name:'铁皮鼠', emoji:'🐀', hp:20,  atk:2, ess:3,  skill:'harden'},
    {name:'腐骨犬', emoji:'🐕', hp:34,  atk:3, ess:4,  skill:'bloodthirst'},
    {name:'灰翼蝠', emoji:'🦇', hp:44,  atk:4, ess:5,  skill:'haste'},
  ]},
  { tier:'E', name:'锈蚀裂隙', monsters:[
    {name:'幽影狼', emoji:'🐺', hp:78,  atk:7, ess:8,  skill:'rend'},
    {name:'熔岩蛛', emoji:'🕷', hp:110, atk:9, ess:10, skill:'venom'},
    {name:'石甲蜥', emoji:'🦎', hp:165, atk:11,ess:13, skill:'ironwall'},
  ]},
  { tier:'D', name:'深核裂隙', monsters:[
    {name:'电光隼', emoji:'🦅', hp:240, atk:16,ess:18, skill:'triple'},
    {name:'骨刺巨像', emoji:'💀', hp:340, atk:21,ess:22, skill:'crush'},
    {name:'虚空之眼', emoji:'👁', hp:470, atk:26,ess:28, skill:'soul'},
  ]},
];

// ============================================================
// 技能表（吞噬获得）
// ============================================================
const SKILLS = {
  harden:      {name:'硬化', icon:'🛡', cd:7000,  desc:'获得最大生命 20% 的护盾'},
  bloodthirst: {name:'嗜血', icon:'🩸', cd:6000,  desc:'立即回复 10% 生命'},
  haste:       {name:'疾风', icon:'⚡', cd:13000, desc:'5 秒内攻速 ×2'},
  rend:        {name:'裂爪', icon:'🗡', cd:6000,  desc:'一次 220% 攻击力的重击'},
  venom:       {name:'淬毒', icon:'☠', cd:8000,  desc:'中毒 6 秒，每秒 30% 攻击力'},
  ironwall:    {name:'铁壁', icon:'🪨', cd:14000, desc:'5 秒内受到伤害 -50%'},
  triple:      {name:'连斩', icon:'✨', cd:7000,  desc:'连续 3 次 60% 攻击力攻击'},
  crush:       {name:'碎骨', icon:'💥', cd:10000, desc:'300% 攻击力，自损 5% 生命'},
  soul:        {name:'噬魂', icon:'🌀', cd:16000, desc:'立即获得 3 倍怪物精华'},
};

const CONDS = {
  always:   {label:'无条件（冷却好就放）', test:function(c){ return true; }},
  enemyLow: {label:'敌人生命 < 35%',       test:function(c){ return c.monPct < 0.35; }},
  selfLow:  {label:'自身生命 < 55%',       test:function(c){ return c.mePct < 0.55; }},
  opening:  {label:'敌人生命 > 70%（开局）', test:function(c){ return c.monPct > 0.70; }},
  every3:   {label:'每 3 次普攻后',        test:function(c){ return c.atkCount > 0 && c.atkCount % 3 === 0; }},
};

const KILLS_PER_TRAIT = 10;
const SLOT_UNLOCK = [4, 7];
const SAVE_KEY = 'devour_idle_v2';

// ============================================================
// 状态
// ============================================================
function freshState(){
  return {
    ess:0, totalEss:0,
    floorIdx:0, monIdx:0,
    kills:{}, skills:[],
    slots:[{skill:null,cond:'always'},{skill:null,cond:'always'},{skill:null,cond:'always'}],
    atk:5, hpMax:50, hp:50, crit:5, spdLv:0,
    upAtkLv:0, upHpLv:0, upCritLv:0,
    lastFight:null,
  };
}
let S = null;

function slotCount(){
  return 1 + SLOT_UNLOCK.filter(function(n){ return S.skills.length >= n; }).length;
}

// ---------- 运行时（不入档） ----------
const R = {
  monHp:0, monHpMax:1,
  monTimer:0, atkTimer:0, atkCount:0,
  shield:0,
  hasteUntil:0, armorUntil:0, poisonUntil:0, poisonDps:0, poisonAcc:0,
  cds:{},
  fightStart:0, fightSkillUses:0,
  fightId:0, slKey:'',
  dead:false,
};

// 脏标记：渲染合并到最多每 80ms 一次，避免每次都重建 DOM 造成卡顿
let dirty = true, lastRender = 0;
function markDirty(){ dirty = true; }

function curMon(){
  const f = FLOORS[S.floorIdx], m = f.monsters[S.monIdx];
  const k = S.kills[m.name] || 0;
  const scale = 1 + Math.max(0, Math.floor(k / KILLS_PER_TRAIT) - 1) * 0.10;
  return {name:m.name, emoji:m.emoji, skill:m.skill,
    hpMax:Math.round(m.hp*scale), atk:Math.round(m.atk*scale), ess:Math.round(m.ess*scale)};
}

function derived(){
  const has = function(id){ return S.skills.indexOf(id) >= 0; };
  return {
    atk:S.atk,
    hpMax:S.hpMax,
    crit:S.crit,
    critDmg: has('rend') ? 1.8 : 1.5,
    atkInterval: 900 * Math.pow(0.92, S.spdLv),
  };
}

// ============================================================
// 工具
// ============================================================
function now(){ return performance.now(); }

function log(msg, cls){
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = msg;
  el.insertBefore(d, el.firstChild);
  while(el.children.length > 50) el.removeChild(el.lastChild);
}
function floatDmg(text, kind){
  const d = document.createElement('div');
  d.className = 'dmg ' + (kind || 'normal');
  d.textContent = text;
  d.style.left = (45 + Math.random()*10) + '%';
  document.getElementById('monsterCard').appendChild(d);
  setTimeout(function(){ d.remove(); }, 800);
}
function flash(){ const f=document.createElement('div'); f.className='flash';
  document.body.appendChild(f); setTimeout(function(){f.remove();},950); }
function toast(msg){ const t=document.createElement('div'); t.className='toast';
  t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},1850); }

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      S = Object.assign(freshState(), p);
      if(!Array.isArray(S.slots) || S.slots.length !== 3) S.slots = freshState().slots;
      if(!Array.isArray(S.skills)) S.skills = [];
      return true;
    }
  }catch(e){}
  S = freshState();
  return false;
}

// ============================================================
// 战斗核心
// ============================================================
function startFight(){
  const m = curMon();
  R.monHpMax = m.hpMax; R.monHp = m.hpMax;
  R.monTimer = 0; R.atkTimer = 0; R.atkCount = 0;
  R.shield = 0;
  R.fightStart = now(); R.fightSkillUses = 0;
  R.fightId++;
  render(); dirty = false; lastRender = now();
}

function damageMonster(dmg, tag){
  R.monHp -= dmg;
  floatDmg((tag ? tag + ' ' : '') + '-' + dmg, tag ? 'skill' : 'normal');
  if(R.monHp <= 0){ R.monHp = 0; killMonster(); return true; }
  markDirty();
  return false;
}

function playerAttack(){
  const D = derived();
  const isCrit = Math.random()*100 < D.crit;
  const dmg = isCrit ? Math.round(D.atk*D.critDmg) : D.atk;
  R.atkCount++;
  damageMonster(dmg, isCrit ? '暴击' : '');
}

function killMonster(){
  const m = curMon();
  const dur = ((now() - R.fightStart)/1000).toFixed(1);
  S.ess += m.ess; S.totalEss += m.ess;
  S.kills[m.name] = (S.kills[m.name] || 0) + 1;
  const k = S.kills[m.name];

  S.lastFight = {t:parseFloat(dur), name:m.name, uses:R.fightSkillUses};
  const lf = document.getElementById('sLast');
  if(lf) lf.textContent = dur + 's · ' + R.fightSkillUses + ' 技能';

  log('击杀 ' + m.name + '｜' + dur + 's｜+' + m.ess + ' 精华｜技能 ' + R.fightSkillUses + ' 次', 'c-good');

  if(k === KILLS_PER_TRAIT && S.skills.indexOf(m.skill) < 0){
    S.skills.push(m.skill);
    const sk = SKILLS[m.skill];
    flash(); toast('吞噬完成 · ' + sk.icon + ' ' + sk.name);
    log('【吞噬进化】习得技能：' + sk.name + ' —— ' + sk.desc, 'c-epic');
    if(S.skills.length === SLOT_UNLOCK[0] || S.skills.length === SLOT_UNLOCK[1]){
      log('【系统】战术槽位 +1（当前 ' + slotCount() + ' 槽）', 'c-epic');
      toast('战术槽位 +1');
    }
  }
  startFight(); save();
}

function monsterAttack(){
  const D = derived();
  const m = curMon();
  let dmg = m.atk * (now() < R.armorUntil ? 0.5 : 1);
  dmg = Math.max(1, Math.round(dmg));

  if(R.shield > 0){
    const ab = Math.min(R.shield, dmg);
    R.shield -= ab; dmg -= ab;
    if(ab > 0) floatDmg('盾 -' + ab, 'skill');
  }
  if(dmg > 0) S.hp -= dmg;

  if(S.hp <= 0){
    S.hp = 0; R.dead = true;
    log('【重伤】被 ' + m.name + ' 击退，回营地恢复', 'c-bad');
    setTimeout(function(){
      S.hp = derived().hpMax; R.dead = false;
      R.monHp = R.monHpMax; R.fightStart = now(); R.fightSkillUses = 0;
      render(); save();
    }, 1500);
    render(); dirty = false; lastRender = now();
    return;
  }
  markDirty();
}

function castSkill(id){
  const D = derived();
  const sk = SKILLS[id];
  const m = curMon();
  R.cds[id] = now() + sk.cd;
  R.fightSkillUses++;

  if(id === 'harden'){
    R.shield += Math.round(D.hpMax*0.2);
  } else if(id === 'bloodthirst'){
    const heal = Math.round(D.hpMax*0.1);
    S.hp = Math.min(D.hpMax, S.hp + heal);
    floatDmg('+' + heal, 'skill');
  } else if(id === 'haste'){
    R.hasteUntil = now() + 5000;
  } else if(id === 'rend'){
    damageMonster(Math.round(D.atk*2.2), '裂爪');
  } else if(id === 'venom'){
    R.poisonUntil = now() + 6000; R.poisonDps = Math.max(1, Math.round(D.atk*0.3));
  } else if(id === 'ironwall'){
    R.armorUntil = now() + 5000;
  } else if(id === 'triple'){
    (function(fid){
      for(let i=0;i<3;i++){
        setTimeout(function(){
          if(fid !== R.fightId) return;
          if(R.monHp > 0) damageMonster(Math.round(D.atk*0.6), '连斩');
        }, i*130);
      }
    })(R.fightId);
  } else if(id === 'crush'){
    damageMonster(Math.round(D.atk*3.0), '碎骨');
    if(S.hp > 1) S.hp = Math.max(1, S.hp - Math.round(D.hpMax*0.05));
  } else if(id === 'soul'){
    S.ess += m.ess*3;
    floatDmg('+' + (m.ess*3) + '精华', 'skill');
  }

  let condLabel = '无条件';
  for(let i=0;i<3;i++){
    if(S.slots[i].skill === id) condLabel = CONDS[S.slots[i].cond].label;
  }
  log('【' + sk.name + '】' + condLabel, 'c-skill');
  markDirty();
}

function checkSkills(){
  const D = derived();
  const ctx = {
    monPct: R.monHp / Math.max(1, R.monHpMax),
    mePct: S.hp / Math.max(1, D.hpMax),
    atkCount: R.atkCount,
  };
  const cnt = slotCount();
  for(let i=0;i<cnt;i++){
    const slot = S.slots[i];
    if(!slot.skill) continue;
    if((R.cds[slot.skill] || 0) > now()) continue;
    if(!CONDS[slot.cond].test(ctx)) continue;
    castSkill(slot.skill);
    if(R.monHp <= 0) return;
  }
}

// ============================================================
// 主循环
// ============================================================
let last = performance.now();
function loop(t){
  const dt = Math.min(150, t - last); last = t;

  if(!R.dead && R.monHp > 0 && now() < R.poisonUntil){
    R.poisonAcc += dt;
    if(R.poisonAcc >= 1000){
      R.poisonAcc = 0;
      damageMonster(R.poisonDps, '毒');
    }
  }
  if(!R.dead && R.monHp > 0){
    const D = derived();
    const interval = now() < R.hasteUntil ? D.atkInterval*0.5 : D.atkInterval;
    R.atkTimer += dt;
    if(R.atkTimer >= interval){ R.atkTimer = 0; playerAttack(); }
  }
  if(!R.dead && R.monHp > 0) checkSkills();
  if(!R.dead && R.monHp > 0){
    R.monTimer += dt;
    if(R.monTimer >= 1700){ R.monTimer = 0; monsterAttack(); }
  }
  if(dirty && t - lastRender >= 80){
    render(); dirty = false; lastRender = t;
  }
  requestAnimationFrame(loop);
}

// ============================================================
// 渲染
// ============================================================
function render(){
  const D = derived();
  const m = curMon();
  const f = FLOORS[S.floorIdx];
  const killed = S.kills[m.name] || 0;
  const hasSkill = S.skills.indexOf(m.skill) >= 0;
  const pct = Math.max(0, R.monHp / Math.max(1, R.monHpMax));

  document.getElementById('ess').textContent = S.ess;
  document.getElementById('floorName').textContent = f.tier;
  document.getElementById('floorIdx').textContent = S.floorIdx + 1;

  document.getElementById('monEmoji').textContent = m.emoji;
  document.getElementById('monName').textContent = m.name;
  const st = document.getElementById('monStage');
  st.textContent = hasSkill ? '已吞噬 · 技能已获得' : '已吞噬 ' + killed + ' / ' + KILLS_PER_TRAIT;
  st.style.color = hasSkill ? '#a78bfa' : '#5a6b80';

  document.getElementById('monHpBar').style.width = (pct*100) + '%';
  document.getElementById('monHpTxt').textContent = Math.max(0, Math.ceil(R.monHp)) + ' / ' + R.monHpMax;

  const mePct = Math.max(0, S.hp / D.hpMax);
  document.getElementById('meHpBar').style.width = (mePct*100) + '%';
  document.getElementById('meHpBar').style.background = mePct < 0.3
    ? 'linear-gradient(90deg,#a33,#e08080)' : 'linear-gradient(90deg,#3f8f5f,#7dd3a0)';
  document.getElementById('meHpTxt').textContent = '你 ' + Math.ceil(S.hp) + ' / ' + D.hpMax;

  const sb = document.getElementById('shieldBar');
  if(R.shield > 0){
    sb.style.display = 'block';
    document.getElementById('shieldFill').style.width = Math.min(100, R.shield/D.hpMax*100) + '%';
  } else sb.style.display = 'none';

  document.getElementById('sAtk').textContent = D.atk;
  document.getElementById('sHp').textContent = Math.ceil(S.hp) + ' / ' + D.hpMax;
  document.getElementById('sCrit').textContent = D.crit + '%';

  const cnt = slotCount();
  document.getElementById('slotHint').textContent = cnt + ' / 3 槽位';
  const sl = document.getElementById('slotList');
  const slKey = cnt + '|' + S.slots.map(function(s){ return (s.skill||'-') + ':' + s.cond; }).join(',');
  if(slKey !== R.slKey){
    R.slKey = slKey;
    sl.innerHTML = S.slots.map(function(s, i){
    if(i >= cnt){
      return '<div class="slot locked"><div class="sicon">🔒</div>' +
        '<div class="sinfo"><div class="sname none">未解锁</div>' +
        '<div class="scond">吞噬 ' + SLOT_UNLOCK[i-1] + ' 个技能解锁</div></div></div>';
    }
    if(!s.skill){
      return '<div class="slot empty" onclick="openPicker(' + i + ')"><div class="sicon">＋</div>' +
        '<div class="sinfo"><div class="sname none">空槽位</div>' +
        '<div class="scond">点击配置技能与触发条件</div></div><div class="sarrow">›</div></div>';
    }
    const sk = SKILLS[s.skill];
    return '<div class="slot" onclick="openPicker(' + i + ')"><div class="sicon">' + sk.icon + '</div>' +
      '<div class="sinfo"><div class="sname">' + sk.name + '</div>' +
        '<div class="scond">' + CONDS[s.cond].label + '</div></div><div class="sarrow">›</div></div>';
    }).join('');
  }

  const costs = {
    atk: Math.round(12*Math.pow(1.24, S.upAtkLv)),
    hp:  Math.round(12*Math.pow(1.24, S.upHpLv)),
    crit:Math.round(30*Math.pow(1.60, S.upCritLv)),
    speed:Math.round(40*Math.pow(1.45, S.spdLv)),
  };
  setBtn('uAtk', costs.atk, 'cAtk');
  setBtn('uHp', costs.hp, 'cHp');
  setBtn('uCrit', costs.crit, 'cCrit');
  setBtn('uSpeed', costs.speed, 'cSpeed');

  document.getElementById('autoTxt').textContent = R.dead ? '恢复中…' : '自动战斗中';
}

function setBtn(id, cost, costId){
  const btn = document.getElementById(id);
  const can = S.ess >= cost;
  btn.disabled = !can;
  btn.classList.toggle('can', can);
  document.getElementById(costId).textContent = cost + ' 精华';
}

// ============================================================
// 槽位配置面板
// ============================================================
window.openPicker = function(slotIdx){
  const slot = S.slots[slotIdx];
  const owned = S.skills;
  const taken = {};
  S.slots.forEach(function(s, i){ if(i !== slotIdx && s.skill) taken[s.skill] = true; });

  let html = '<h4>槽位 ' + (slotIdx+1) + ' · 技能</h4>';
  if(owned.length === 0){
    html += '<div class="opt lock"><div class="ot">还没有吞噬任何技能' +
      '<div class="od">把同类怪物击杀 10 只即可吞噬</div></div></div>';
  } else {
    owned.forEach(function(id){
      const sk = SKILLS[id];
      const isTaken = !!taken[id];
      html += '<div class="opt ' + (slot.skill === id ? 'sel' : '') + ' ' + (isTaken ? 'lock' : '') + '" ' +
        (isTaken ? '' : 'onclick="setSlotSkill(' + slotIdx + ',\'' + id + '\')"') + '>' +
        '<div class="oi">' + sk.icon + '</div>' +
        '<div class="ot">' + sk.name + '<div class="od">' + sk.desc + '</div></div>' +
        '<div class="od">' + (isTaken ? '已在其它槽' : 'CD ' + (sk.cd/1000) + 's') + '</div></div>';
    });
  }
  html += '<h4 style="margin-top:16px">触发条件</h4>';
  Object.keys(CONDS).forEach(function(k){
    html += '<div class="opt ' + (slot.cond === k ? 'sel' : '') + '" onclick="setSlotCond(' + slotIdx + ',\'' + k + '\')">' +
      '<div class="oi">◈</div><div class="ot">' + CONDS[k].label + '</div></div>';
  });
  html += '<div class="opt" onclick="clearSlot(' + slotIdx + ')"><div class="oi">✕</div>' +
    '<div class="ot">清空此槽位</div></div>' +
    '<button class="close" onclick="closePicker()">完成</button>';

  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('on');
};

window.setSlotSkill = function(i, id){
  S.slots.forEach(function(s, idx){ if(idx !== i && s.skill === id) s.skill = null; });
  S.slots[i].skill = id;
  render(); save();
  log('【战术】槽位 ' + (i+1) + ' 配置为 ' + SKILLS[id].name, 'c-skill');
};
window.setSlotCond = function(i, cond){ S.slots[i].cond = cond; render(); save(); };
window.clearSlot = function(i){ S.slots[i].skill = null; render(); save(); };
window.closePicker = function(){ document.getElementById('overlay').classList.remove('on'); };

// ============================================================
// 交互
// ============================================================
document.getElementById('uAtk').onclick = function(){
  const c = Math.round(12*Math.pow(1.24, S.upAtkLv));
  if(S.ess < c) return;
  S.ess -= c; S.upAtkLv++; S.atk += 2; render(); save();
};
document.getElementById('uHp').onclick = function(){
  const c = Math.round(12*Math.pow(1.24, S.upHpLv));
  if(S.ess < c) return;
  S.ess -= c; S.upHpLv++; S.hpMax += 10; S.hp += 10; render(); save();
};
document.getElementById('uCrit').onclick = function(){
  const c = Math.round(30*Math.pow(1.60, S.upCritLv));
  if(S.ess < c) return;
  S.ess -= c; S.upCritLv++; S.crit += 1; render(); save();
};
document.getElementById('uSpeed').onclick = function(){
  const c = Math.round(40*Math.pow(1.45, S.spdLv));
  if(S.ess < c) return;
  S.ess -= c; S.spdLv++; render(); save();
};

document.getElementById('btnNext').onclick = function(){
  const f = FLOORS[S.floorIdx];
  if(S.monIdx < f.monsters.length - 1){
    S.monIdx++;
  } else if(S.floorIdx < FLOORS.length - 1){
    S.floorIdx++; S.monIdx = 0;
    log('【进入】' + FLOORS[S.floorIdx].name + '（' + FLOORS[S.floorIdx].tier + ' 级）', 'c-epic');
  } else { log('已到达当前版本最深处。'); return; }
  startFight(); save();
};

document.getElementById('btnReset').onclick = function(){
  if(!confirm('确认重置全部进度？此操作不可撤销。')) return;
  localStorage.removeItem(SAVE_KEY);
  S = freshState(); R.cds = {};
  startFight(); save();
  log('进度已重置。');
};

document.getElementById('overlay').onclick = function(e){
  if(e.target.id === 'overlay') closePicker();
};

// ============================================================
// 启动
// ============================================================
function boot(){
  const had = load();
  startFight();
  if(had){
    log('【系统】读取存档，继续自动战斗。');
  } else {
    log('【系统】裂隙降临。战斗已全自动。');
    log('吞噬同类 10 只 → 习得技能 → 到「战术」里配触发条件。');
  }
  render();
  requestAnimationFrame(loop);
}
boot();
</script>
