<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<title>吞噬进化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0e14;color:#c8d3e0;min-height:100vh;overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 50% 0%,#141d2b 0%,#0a0e14 60%);
}
#app{max-width:480px;margin:0 auto;padding:10px 12px 90px;position:relative}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:rgba(20,29,43,.7);border:1px solid #1e2b3d;
  border-radius:10px;margin-bottom:10px;font-size:13px}
.topbar .ess{color:#7dd3a0;font-weight:600}
.topbar .floor{color:#7aa2f7}

/* ---------- 怪物卡 ---------- */
.monster{
  background:linear-gradient(180deg,#141d2b 0%,#0f1620 100%);
  border:1px solid #1e2b3d;border-radius:14px;padding:14px;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.monster::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%,rgba(122,162,247,.08),transparent 70%);
  pointer-events:none}
.mon-name{font-size:17px;font-weight:700;color:#e6edf7;margin-bottom:2px;text-align:center}
.mon-stage{font-size:11px;color:#5a6b80;text-align:center;margin-bottom:10px}
.mon-emoji{font-size:52px;text-align:center;line-height:1.1;margin-bottom:8px;
  filter:drop-shadow(0 0 14px rgba(122,162,247,.35))}
.bar{background:#0a0e14;border-radius:6px;height:16px;overflow:hidden;
  border:1px solid #1e2b3d;position:relative;margin-bottom:6px}
.bar-fill{height:100%;transition:width .18s linear;border-radius:5px}
.bar-fill.hp-mon{background:linear-gradient(90deg,#e05252,#f28b8b)}
.bar-fill.hp-me{background:linear-gradient(90deg,#3f8f5f,#7dd3a0)}
.bar-fill.exp{background:linear-gradient(90deg,#6b4fbf,#a78bfa)}
.bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#e6edf7;text-shadow:0 1px 2px #000}

/* ---------- 攻击按钮 ---------- */
.attack{
  width:100%;padding:18px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,#7a5cd6,#3d6fd6);color:#fff;
  font-size:17px;font-weight:700;letter-spacing:1px;
  box-shadow:0 4px 18px rgba(93,108,214,.35);
  transition:transform .06s,box-shadow .06s;margin-bottom:10px;
}
.attack:active{transform:scale(.97);box-shadow:0 2px 8px rgba(93,108,214,.3)}
.attack[disabled]{opacity:.45}

/* ---------- 面板区 ---------- */
.panel{background:rgba(20,29,43,.55);border:1px solid #1e2b3d;border-radius:12px;
  padding:12px;margin-bottom:10px}
.panel h3{font-size:12px;color:#5a6b80;font-weight:600;letter-spacing:1px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
  font-size:13px;border-bottom:1px solid rgba(30,43,61,.6)}
.row:last-child{border-bottom:none}
.row .k{color:#8a9bb0}
.row .v{color:#e6edf7;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 升级按钮 ---------- */
.upg{display:flex;flex-wrap:wrap;gap:8px}
.upg button{
  flex:1 1 calc(50% - 4px);padding:12px 8px;border-radius:10px;cursor:pointer;
  background:#16202e;border:1px solid #22303f;color:#c8d3e0;
  font-size:13px;font-weight:600;transition:.12s;font-family:inherit;
}
.upg button:active{transform:scale(.96)}
.upg button.can{border-color:#3f8f5f;background:rgba(63,143,95,.15);color:#a7e3bd}
.upg button:disabled{opacity:.4}
.upg .cost{display:block;font-size:11px;color:#7dd3a0;margin-top:3px;font-weight:500}

/* ---------- 吞噬/进化 ---------- */
.trait{display:flex;gap:8px;align-items:flex-start;padding:8px 0;
  border-bottom:1px solid rgba(30,43,61,.6);font-size:12px}
.trait:last-child{border-bottom:none}
.trait .icon{font-size:16px;flex-shrink:0}
.trait .body{flex:1}
.trait .tname{color:#a78bfa;font-weight:700;margin-bottom:2px}
.trait .tdesc{color:#8a9bb0;font-size:11px;line-height:1.4}
.trait .prog{font-size:10px;color:#5a6b80;margin-top:2px}
.trait.locked .tname{color:#44566b}
.trait.locked .icon{filter:grayscale(1);opacity:.4}

/* ---------- 日志 ---------- */
.log{max-height:110px;overflow-y:auto;font-size:11.5px;line-height:1.7;color:#8a9bb0;
  font-family:ui-monospace,Consolas,monospace}
.log div{padding:1px 0}
.log .c-good{color:#7dd3a0}
.log .c-bad{color:#e08080}
.log .c-epic{color:#c4a5ff;font-weight:600}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:#22303f;border-radius:2px}

/* ---------- 底栏 ---------- */
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,20,.96);
  border-top:1px solid #1e2b3d;padding:8px 12px;display:flex;gap:8px;
  backdrop-filter:blur(12px);z-index:10}
.bottom button{flex:1;padding:11px;border-radius:9px;border:1px solid #22303f;
  background:#16202e;color:#8a9bb0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bottom button:active{transform:scale(.96)}

/* ---------- 浮动伤害 ---------- */
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1.15)}}
.dmg{position:absolute;left:50%;top:40%;font-size:20px;font-weight:800;
  pointer-events:none;animation:floatUp .75s ease-out forwards;z-index:5;
  text-shadow:0 2px 6px #000}
.dmg.crit{font-size:27px;color:#ffd166}
.dmg.normal{color:#ff9d9d}

/* ---------- 吞噬闪光 ---------- */
@keyframes devourFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 65%);
  pointer-events:none;animation:devourFlash .9s ease-out;z-index:20}

.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);
  background:rgba(167,139,250,.95);color:#0a0e14;padding:10px 18px;border-radius:9px;
  font-size:13px;font-weight:700;z-index:30;pointer-events:none;
  box-shadow:0 6px 24px rgba(167,139,250,.4);animation:devourFlash 1.8s ease-out forwards}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>精华 <span class="ess" id="ess">0</span></div>
    <div>裂隙 <span class="floor" id="floorName">F</span> · 第<span id="floorIdx">1</span>层</div>
  </div>

  <div class="monster" id="monsterCard">
    <div class="mon-emoji" id="monEmoji">🐀</div>
    <div class="mon-name" id="monName">铁皮鼠</div>
    <div class="mon-stage" id="monStage">已吞噬 0 / 10</div>
    <div class="bar"><div class="bar-fill hp-mon" id="monHpBar" style="width:100%"></div>
      <div class="bar-txt" id="monHpTxt">20 / 20</div></div>
    <div class="bar" style="height:10px"><div class="bar-fill hp-me" id="meHpBar" style="width:100%"></div>
      <div class="bar-txt" style="font-size:9px;opacity:.75" id="meHpTxt">你 50 / 50</div></div>
  </div>

  <button class="attack" id="btnAttack">攻 击</button>

  <div class="panel">
    <h3>属性</h3>
    <div class="row"><span class="k">攻击力</span><span class="v" id="sAtk">5</span></div>
    <div class="row"><span class="k">生命</span><span class="v" id="sHp">50 / 50</span></div>
    <div class="row"><span class="k">暴击率</span><span class="v" id="sCrit">5%</span></div>
    <div class="row"><span class="k">每秒精华</span><span class="v" id="sEss">0</span></div>
  </div>

  <div class="panel">
    <h3>强化</h3>
    <div class="upg">
      <button id="uAtk">攻击 +2<span class="cost" id="cAtk">10 精华</span></button>
      <button id="uHp">生命 +10<span class="cost" id="cHp">10 精华</span></button>
      <button id="uCrit">暴击 +1%<span class="cost" id="cCrit">25 精华</span></button>
      <button id="uAuto">自动攻击<span class="cost" id="cAuto">60 精华</span></button>
    </div>
  </div>

  <div class="panel">
    <h3>吞噬图鉴</h3>
    <div id="traitList"></div>
  </div>

  <div class="panel">
    <h3>记录</h3>
    <div class="log" id="log"></div>
  </div>

</div>

<div class="bottom">
  <button id="btnNext">深入下一层</button>
  <button id="btnReset">重置</button>
</div>

<script>
// ============================================================
// 配置：顶层数值表（改这里就能调平衡）
// ============================================================
const FLOORS = [
  { tier:'F', name:'微光裂隙', monsters:[
    {name:'铁皮鼠', emoji:'🐀', hp:20,  atk:2, ess:3,
     trait:{icon:'🛡', name:'皮糙', desc:'最大生命 +20%'}},
    {name:'腐骨犬', emoji:'🐕', hp:34,  atk:3, ess:4,
     trait:{icon:'🩸', name:'嗜血', desc:'击杀回复 6% 生命'}},
    {name:'灰翼蝠', emoji:'🦇', hp:44,  atk:4, ess:5,
     trait:{icon:'⚡', name:'迅捷', desc:'攻击间隔 -12%'}},
  ]},
  { tier:'E', name:'锈蚀裂隙', monsters:[
    {name:'幽影狼', emoji:'🐺', hp:78,  atk:7, ess:8,
     trait:{icon:'🗡', name:'撕裂', desc:'暴击伤害 +40%'}},
    {name:'熔岩蛛', emoji:'🕷', hp:110, atk:9, ess:10,
     trait:{icon:'☠', name:'淬毒', desc:'每次攻击附加 3 点真实伤害'}},
    {name:'石甲蜥', emoji:'🦎', hp:165, atk:11, ess:13,
     trait:{icon:'🪨', name:'甲壳', desc:'受到伤害 -18%'}},
  ]},
  { tier:'D', name:'深核裂隙', monsters:[
    {name:'电光隼', emoji:'🦅', hp:240, atk:16, ess:18,
     trait:{icon:'✨', name:'连击', desc:'22% 概率追加一次攻击'}},
    {name:'骨刺巨像', emoji:'💀', hp:340, atk:21, ess:22,
     trait:{icon:'💥', name:'重压', desc:'攻击力 +15%'}},
    {name:'虚空之眼', emoji:'👁', hp:470, atk:26, ess:28,
     trait:{icon:'🌀', name:'噬魂', desc:'击杀获得精华 +25%'}},
  ]},
];

const KILLS_PER_TRAIT = 10;   // 同类击杀多少只解锁吞噬
const MAX_TRAITS = FLOORS.reduce((a,f)=>a+f.monsters.length,0);

// ============================================================
// 状态
// ============================================================
const SAVE_KEY = 'devour_idle_v1';
let S = null;

function freshState(){
  return {
    ess:0,
    floorIdx:0,          // 楼层
    monIdx:0,            // 本层怪物序号
    kills:{},            // 各怪击杀数
    traits:[],           // 已解锁特性 key
    atk:5, hpMax:50, hp:50, crit:5,
    upAtkLv:0, upHpLv:0, upCritLv:0,
    autoUnlocked:false, autoOn:true,
    monHp:null,
    totalEss:0,
  };
}

// ---------- 派生属性（含吞噬特性加成） ----------
function derived(){
  const has = k => S.traits.includes(k);
  let atk = S.atk, hpMax = S.hpMax, crit = S.crit;
  if(has('重压')) atk = Math.round(atk * 1.15);
  if(has('皮糙')) hpMax = Math.round(hpMax * 1.20);
  return {
    atk, hpMax, crit,
    critDmg: has('撕裂') ? 1.9 : 1.5,
    atkInterval: has('迅捷') ? 850 : 1000,
    dmgReduce: has('甲壳') ? 0.82 : 1.0,
    lifesteal: has('嗜血') ? 0.06 : 0,
    poison: has('淬毒') ? 3 : 0,
    doubleChance: has('连击') ? 0.22 : 0,
    essBonus: has('噬魂') ? 1.25 : 1.0,
  };
}

// ---------- 当前怪物 ----------
function curMon(){
  const f = FLOORS[S.floorIdx];
  const m = f.monsters[S.monIdx];
  const killed = S.kills[m.name] || 0;
  // 每次重生略微变强（+8%），避免无限刷同一只过于划算
  const scale = 1 + Math.max(0, Math.floor(killed / KILLS_PER_TRAIT) - 1) * 0.08;
  return {
    ...m,
    hpMax: Math.round(m.hp * scale),
    atk: Math.round(m.atk * scale),
    ess: Math.round(m.ess * scale),
  };
}

// ============================================================
// 存档
// ============================================================
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ S = Object.assign(freshState(), JSON.parse(raw)); return true; }
  }catch(e){}
  S = freshState(); return false;
}

// ============================================================
// 主逻辑
// ============================================================
let monHp = 0, monTimer = 0, autoTimer = 0, dead = false;

function initMonster(){
  const m = curMon();
  monHp = m.hpMax;
  monTimer = 0;
  S.monHp = monHp;
  dead = false;
  render();
}

function log(msg, cls=''){
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = msg;
  el.insertBefore(d, el.firstChild);
  while(el.children.length > 60) el.removeChild(el.lastChild);
}

function floatDmg(text, crit){
  const d = document.createElement('div');
  d.className = 'dmg ' + (crit ? 'crit' : 'normal');
  d.textContent = text;
  d.style.left = (45 + Math.random()*10) + '%';
  document.getElementById('monsterCard').appendChild(d);
  setTimeout(()=>d.remove(), 800);
}

function screenFlash(){
  const f = document.createElement('div');
  f.className = 'flash';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 950);
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1850);
}

// ---------- 玩家攻击 ----------
function playerHit(){
  if(dead) return;
  const D = derived();
  let dmg = D.atk + D.poison;
  const isCrit = Math.random()*100 < D.crit;
  if(isCrit) dmg = Math.round(dmg * D.critDmg);
  applyDamage(dmg, isCrit);
  // 连击
  if(Math.random() < D.doubleChance){
    setTimeout(()=>{ if(!dead && monHp > 0) {
      const d2 = Math.round(S.atk * 0.7);
      floatDmg(d2, false);
      applyDamage(d2, false);
    }}, 110);
  }
}

function applyDamage(dmg, isCrit){
  monHp -= dmg;
  floatDmg('-' + dmg, isCrit);
  if(monHp <= 0){ monHp = 0; killMonster(); }
  render();
}

function killMonster(){
  const m = curMon();
  const D = derived();
  const gain = Math.round(m.ess * D.essBonus);
  S.ess += gain; S.totalEss += gain;

  S.kills[m.name] = (S.kills[m.name] || 0) + 1;
  const k = S.kills[m.name];
  log(`击杀 ${m.name}，+${gain} 精华（累计 ${k}/${KILLS_PER_TRAIT}）`, 'c-good');

  // 吸血
  if(D.lifesteal > 0){
    const heal = Math.round(D.hpMax * D.lifesteal);
    S.hp = Math.min(D.hpMax, S.hp + heal);
  }

  // 吞噬解锁
  if(k === KILLS_PER_TRAIT && !S.traits.includes(m.trait.name)){
    S.traits.push(m.trait.name);
    screenFlash();
    toast(`吞噬完成 · ${m.trait.icon} ${m.trait.name}`);
    log(`【吞噬进化】获得特性：${m.trait.name} —— ${m.trait.desc}`, 'c-epic');
  }

  initMonster();
  save();
  render();
}

// ---------- 怪物反击 ----------
function monsterTick(dt){
  if(dead) return;
  const D = derived();
  const m = curMon();
  monTimer += dt;
  if(monTimer >= 1500){
    monTimer = 0;
    const raw = m.atk;
    const dmg = Math.max(1, Math.round(raw * D.dmgReduce));
    S.hp -= dmg;
    log(`${m.name} 反击，受到 ${dmg} 伤害`, 'c-bad');
    if(S.hp <= 0){
      S.hp = 0; dead = true;
      log('【重伤】被击退回营地，生命已恢复', 'c-bad');
      setTimeout(()=>{
        S.hp = D.hpMax; dead = false;
        initMonster();
        log('已恢复，继续。');
        render(); save();
      }, 1400);
    }
    render();
  }
}

// ---------- 主循环 ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(120, now - last); last = now;

  if(!dead){
    monsterTick(dt);
    if(S.autoUnlocked && S.autoOn){
      autoTimer += dt;
      const D = derived();
      if(autoTimer >= D.atkInterval){ autoTimer = 0; playerHit(); }
    }
  }
  requestAnimationFrame(loop);
}

// ============================================================
// 渲染
// ============================================================
function render(){
  const D = derived();
  const m = curMon();
  const f = FLOORS[S.floorIdx];
  const killed = S.kills[m.name] || 0;
  const pct = Math.max(0, monHp / m.hpMax);
  const hasTrait = S.traits.includes(m.trait.name);

  document.getElementById('ess').textContent = S.ess;
  document.getElementById('floorName').textContent = f.tier;
  document.getElementById('floorIdx').textContent = S.floorIdx + 1;

  document.getElementById('monEmoji').textContent = m.emoji;
  document.getElementById('monName').textContent = m.name;
  document.getElementById('monStage').textContent =
    hasTrait ? '已吞噬 · 特性已获得' : `已吞噬 ${killed} / ${KILLS_PER_TRAIT}`;
  document.getElementById('monStage').style.color = hasTrait ? '#a78bfa' : '#5a6b80';

  document.getElementById('monHpBar').style.width = (pct*100) + '%';
  document.getElementById('monHpTxt').textContent = `${Math.max(0,Math.ceil(monHp))} / ${m.hpMax}`;

  const mePct = Math.max(0, S.hp / D.hpMax);
  document.getElementById('meHpBar').style.width = (mePct*100) + '%';
  document.getElementById('meHpBar').style.background = mePct < .3
    ? 'linear-gradient(90deg,#a33,#e08080)' : 'linear-gradient(90deg,#3f8f5f,#7dd3a0)';
  const meTxt = document.getElementById('meHpTxt');
  if(meTxt) meTxt.textContent = `你 ${Math.ceil(S.hp)} / ${D.hpMax}`;

  document.getElementById('sAtk').textContent = D.atk;
  document.getElementById('sHp').textContent = `${Math.ceil(S.hp)} / ${D.hpMax}`;
  document.getElementById('sCrit').textContent = D.crit + '%';
  const essRate = (m.ess * D.essBonus) / Math.max(1, (m.hpMax / Math.max(1, D.atk * 1.1)) * (D.atkInterval/1000) + 1.5);
  document.getElementById('sEss').textContent = essRate.toFixed(1);

  // 升级按钮
  const costs = {
    atk: Math.round(10 * Math.pow(1.22, S.upAtkLv)),
    hp:  Math.round(10 * Math.pow(1.22, S.upHpLv)),
    crit:Math.round(25 * Math.pow(1.55, S.upCritLv)),
  };
  setBtn('uAtk', costs.atk, 'cAtk');
  setBtn('uHp', costs.hp, 'cHp');
  setBtn('uCrit', costs.crit, 'cCrit');
  const autoBtn = document.getElementById('uAuto');
  if(S.autoUnlocked){
    autoBtn.disabled = true;
    autoBtn.querySelector('.cost').textContent = '已解锁';
    autoBtn.classList.add('can');
  } else {
    const can = S.ess >= 60;
    autoBtn.disabled = !can;
    autoBtn.classList.toggle('can', can);
  }

  // 图鉴
  const tl = document.getElementById('traitList');
  const rows = [];
  FLOORS.forEach((fl, fi) => {
    fl.monsters.forEach(mo => {
      const unlocked = S.traits.includes(mo.trait.name);
      const k = S.kills[mo.name] || 0;
      const visible = fi <= S.floorIdx;
      if(!visible) return;
      rows.push(`<div class="trait ${unlocked?'':'locked'}">
        <div class="icon">${mo.trait.icon}</div>
        <div class="body">
          <div class="tname">${mo.trait.name}</div>
          <div class="tdesc">${mo.trait.desc}</div>
          ${unlocked ? '' : `<div class="prog">${mo.name} · ${Math.min(k,KILLS_PER_TRAIT)}/${KILLS_PER_TRAIT}</div>`}
        </div></div>`);
    });
  });
  tl.innerHTML = rows.length ? rows.join('') : '<div class="trait locked"><div class="body"><div class="tdesc">尚未遇到任何怪物</div></div></div>';

  document.getElementById('btnAttack').disabled = dead;
  document.getElementById('btnNext').disabled = S.floorIdx >= FLOORS.length - 1 && S.monIdx >= FLOORS[S.floorIdx].monsters.length - 1;
}

function setBtn(id, cost, costId){
  const btn = document.getElementById(id);
  const can = S.ess >= cost;
  btn.disabled = !can;
  btn.classList.toggle('can', can);
  document.getElementById(costId).textContent = cost + ' 精华';
}

// ============================================================
// 交互
// ============================================================
document.getElementById('btnAttack').onclick = () => { playerHit(); };

document.getElementById('uAtk').onclick = () => {
  const c = Math.round(10 * Math.pow(1.22, S.upAtkLv));
  if(S.ess < c) return;
  S.ess -= c; S.upAtkLv++; S.atk += 2;
  render(); save();
};
document.getElementById('uHp').onclick = () => {
  const c = Math.round(10 * Math.pow(1.22, S.upHpLv));
  if(S.ess < c) return;
  S.ess -= c; S.upHpLv++; S.hpMax += 10; S.hp += 10;
  render(); save();
};
document.getElementById('uCrit').onclick = () => {
  const c = Math.round(25 * Math.pow(1.55, S.upCritLv));
  if(S.ess < c) return;
  S.ess -= c; S.upCritLv++; S.crit += 1;
  render(); save();
};
document.getElementById('uAuto').onclick = () => {
  if(S.autoUnlocked || S.ess < 60) return;
  S.ess -= 60; S.autoUnlocked = true;
  log('【系统】自动攻击已激活', 'c-epic');
  render(); save();
};

document.getElementById('btnNext').onclick = () => {
  const f = FLOORS[S.floorIdx];
  if(S.monIdx < f.monsters.length - 1){
    S.monIdx++;
  } else if(S.floorIdx < FLOORS.length - 1){
    S.floorIdx++; S.monIdx = 0;
    log(`【进入】${FLOORS[S.floorIdx].name}（${FLOORS[S.floorIdx].tier} 级）`, 'c-epic');
  } else {
    log('已到达当前版本最深处。');
    return;
  }
  initMonster(); save();
};

document.getElementById('btnReset').onclick = () => {
  if(!confirm('确认重置全部进度？此操作不可撤销。')) return;
  localStorage.removeItem(SAVE_KEY);
  S = freshState();
  initMonster(); render(); save();
  log('进度已重置。');
};

// 键盘/空格支持（电脑上摸鱼）
document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); playerHit(); }
});

// ============================================================
// 启动
// ============================================================
function boot(){
  const had = load();
  initMonster();
  if(had){
    log('【系统】读取存档成功，从上次的位置继续。');
  } else {
    log('【系统】裂隙降临。你的吞噬系系统已激活。');
    log('击杀同类怪物 10 只，即可吞噬其特性。');
  }
  render();
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
</html>
